# pixi run test on GitHub's computers, so "it works on my machine" can't creep in.
#   Linux (Ubuntu 24.04, like the car): every push and every pull request.
#   Mac (Apple Silicon): every night (the team's repo only), and on demand from the
#   Actions tab. Mac minutes use up a private repo's free allowance much faster than
#   Linux ones, so not on every push.
#   64-bit ARM Linux (the car's Orin and Pis): the same tests on every push and pull
#   request (job arm), and the car kit made and installed offline (job car-kit).
# The Pixi version matches the one that wrote pixi.lock; raise both together.
# A failed test step prints each failing test as an annotation (tools/ci_annotate.py):
# GitHub's API shows those to anyone, the job's log only to people signed in.
name: test

on:
  # Pushes: main in the team's repo, and any branch in a fork (once Actions is turned on
  # there), so a branch is green before its pull request; each job's `if:` keeps the
  # team's repo to main. Never a helper's half-done branch (wt/*, archive/*, backup/*):
  # those mailed a failure each time.
  push:
    branches-ignore: ['wt/**', 'archive/**', 'backup/**']
  pull_request:
  # The merge queue tests each pull request on top of main and the ones ahead of it.
  merge_group:
  schedule:
    - cron: "0 7 * * *"   # 03:00 in Ottawa (EDT)
  workflow_dispatch:

# shell: bash means bash -eo pipefail, so a failed test fails through tee too.
defaults:
  run:
    shell: bash

env:
  PIXI_VERSION: v0.81.0
  # GitHub's Ubuntu runners ship PowerShell and set PSModulePath, so colcon takes PowerShell
  # for its shell and sets each package's environment from package.ps1: our own packages'
  # paths then never reach a build (aav_hud's cargo found no aav_interfaces). Empty,
  # colcon uses sh, as on a laptop.
  PSModulePath: ""

jobs:
  linux:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || github.repository != 'AAV-2025-2026/ecolo-av')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          # GitHub's downloads fail now and then for a few seconds: try 5 times.
          for try in 1 2 3 4 5; do
            curl -fsSL https://pixi.sh/install.sh | bash && [ -x "$HOME/.pixi/bin/pixi" ] && break
            echo "pixi install failed (try $try), again in 20 s"; sleep 20
          done
          [ -x "$HOME/.pixi/bin/pixi" ]
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      # Rust (TODO 209): cargo's downloads and the release target folders colcon builds in
      # (build/<package>/target), and tools/test.sh's own (ros/.../target, firmware/.../target),
      # so a run rebuilds only our crates, not every dependency (the colcon build went from
      # 2208 to 3426 s on 16 Nov). Keyed on every Cargo.lock and pixi.lock (the compiler):
      # a new lock starts from the newest older cache. Not incremental/ (big, debug only).
      # Restored here, saved right after the build (below), so a run whose tests fail or
      # time out still leaves its build for the next: actions/cache saves only on success,
      # and on 18 Nov main's linux job built cold (27 of its 60 min), timed out in the
      # tests, saved nothing, and so the next run would build cold again.
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/*/target
            ros/*/*/target
            firmware/*/target
            !**/target/*/incremental
          key: rust-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'pixi.lock') }}
          restore-keys: rust-${{ runner.arch }}-${{ runner.os }}-
      # A cache from older code can hold rclrs's and rosidl_runtime_rs's build-script output
      # (the libraries to link, where they were): then a Rust node fails to link (20 Nov,
      # PR #34: aav_costmap, Linux and ARM, while the fork's own cache built it). Their
      # build scripts are cheap: run them again every time.
      - name: Drop the ROS Rust bindings' cached build-script output
        run: |
          rm -rf build/*/target/*/build/rclrs-* build/*/target/*/.fingerprint/rclrs-* \
                 build/*/target/*/build/rosidl_runtime_rs-* \
                 build/*/target/*/.fingerprint/rosidl_runtime_rs-*
      # The build on its own, with its own limit, so the tests keep their full 60 min.
      # pixi run test builds again first, but then nothing has changed (a minute or two).
      - name: pixi run build
        timeout-minutes: 45
        run: pixi run --locked build 2>&1 | tee build.log
      - name: Save the Rust cache, even if a later step fails
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/*/target
            ros/*/*/target
            firmware/*/target
            !**/target/*/incremental
          key: rust-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'pixi.lock') }}
      - name: pixi run test
        # A hung test fails the step (and so gets annotated) instead of the job being
        # cancelled at its limit with nothing to read; pytest prints every thread's stack
        # once a test has run 5 min (the Mac nightly of 24 Oct ran past 90 min).
        timeout-minutes: 60
        env:
          PYTEST_ADDOPTS: -o faulthandler_timeout=300
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        # Not when the run failed before the build (GitHub down, say): no log.
        if: (failure() || cancelled()) && hashFiles('test.log', 'build.log') != ''
        # test.log, or build.log when the build step stopped first
        run: python3 tools/ci_annotate.py "$(if [[ -f test.log ]]; then echo test.log; else echo build.log; fi)" build
      - name: The failed packages' errors in full
        # colcon's console shows a linker's first line only; its log keeps the rest.
        if: failure() && hashFiles('build.log') != ''
        run: |
          for f in log/latest_build/*/stderr.log; do
            [ -s "$f" ] && { echo "== $f"; tail -n 80 "$f"; }
          done; true
      - name: The MCP server, over stdio
        run: pixi run --locked -e mcp python3 tools/tests/mcp_smoke.py

  mac:
    if: (github.event_name == 'schedule' && github.repository == 'AAV-2025-2026/ecolo-av') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          # GitHub's downloads fail now and then for a few seconds: try 5 times.
          for try in 1 2 3 4 5; do
