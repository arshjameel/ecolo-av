          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      # Rust (TODO 209): cargo's downloads and the release target folders colcon builds in
      # (build/<package>/target), and tools/test.sh's own (ros/.../target, firmware/.../target),
      # so a run rebuilds only our crates, not every dependency (the colcon build went from
      # 2208 to 3426 s on 16 Nov). Keyed on every Cargo.lock and pixi.lock (the compiler):
      # a new lock starts from the newest older cache. Not incremental/ (big, debug only).
      # Restored here, saved right after the build (below), so a run whose tests fail or
      # time out still leaves its build for the next: actions/cache saves only on success,
      # and on 18 Nov main's linux job built cold (27 of its 60 min), timed out in the
      # tests, saved nothing, and so the next run would build cold again.
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/*/target
            ros/*/*/target
            firmware/*/target
            !**/target/*/incremental
          key: rust-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'pixi.lock') }}
          restore-keys: rust-${{ runner.arch }}-${{ runner.os }}-
      # A cache from older code can hold rclrs's and rosidl_runtime_rs's build-script output
      # (the libraries to link, where they were): then a Rust node fails to link (20 Nov,
      # PR #34: aav_costmap, Linux and ARM, while the fork's own cache built it). Their
      # build scripts are cheap: run them again every time.
      - name: Drop the ROS Rust bindings' cached build-script output
        run: |
          rm -rf build/*/target/*/build/rclrs-* build/*/target/*/.fingerprint/rclrs-* \
                 build/*/target/*/build/rosidl_runtime_rs-* \
                 build/*/target/*/.fingerprint/rosidl_runtime_rs-*
      # The build on its own, with its own limit, so the tests keep their full 60 min.
      # pixi run test builds again first, but then nothing has changed (a minute or two).
      - name: pixi run build
        timeout-minutes: 45
        run: pixi run --locked build 2>&1 | tee build.log
      - name: Save the Rust cache, even if a later step fails
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/*/target
            ros/*/*/target
            firmware/*/target
            !**/target/*/incremental
          key: rust-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'pixi.lock') }}
      - name: pixi run test
        # A hung test fails the step (and so gets annotated) instead of the job being
        # cancelled at its limit with nothing to read; pytest prints every thread's stack
        # once a test has run 5 min (the Mac nightly of 24 Oct ran past 90 min).
        timeout-minutes: 60
        env:
          PYTEST_ADDOPTS: -o faulthandler_timeout=300
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        # Not when the run failed before the build (GitHub down, say): no log.
        if: (failure() || cancelled()) && hashFiles('test.log', 'build.log') != ''
        # test.log, or build.log when the build step stopped first
        run: python3 tools/ci_annotate.py "$(if [[ -f test.log ]]; then echo test.log; else echo build.log; fi)" build
      - name: The failed packages' errors in full
        # colcon's console shows a linker's first line only; its log keeps the rest.
        if: failure() && hashFiles('build.log') != ''
        run: |
          for f in log/latest_build/*/stderr.log; do
            [ -s "$f" ] && { echo "== $f"; tail -n 80 "$f"; }
          done; true
      - name: The MCP server, over stdio
        run: pixi run --locked -e mcp python3 tools/tests/mcp_smoke.py

  # The car's computers are 64-bit ARM (the Orin, the Pis): the same tests on GitHub's free
  # ARM runner, then the HUD and the map window (aav_hud, PLAN T9.2) checked as ARM
  # programs, and each drawn once on a virtual screen. pixi.lock has linux-aarch64 already.
  # Every push, like linux: it takes about as long (12 min on 24 Oct), and runs beside it.
  arm:
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || github.repository != 'AAV-2025-2026/ecolo-av')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          # GitHub's downloads fail now and then for a few seconds: try 5 times.
          for try in 1 2 3 4 5; do
            curl -fsSL https://pixi.sh/install.sh | bash && [ -x "$HOME/.pixi/bin/pixi" ] && break
            echo "pixi install failed (try $try), again in 20 s"; sleep 20
          done
          [ -x "$HOME/.pixi/bin/pixi" ]
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          # Not pixi-pkgs-Linux-*: the linux job's packages are x86_64.
          key: pixi-pkgs-arm64-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-arm64-${{ runner.os }}-
      # Rust (TODO 209): cargo's downloads and the release target folders colcon builds in
      # (build/<package>/target), and tools/test.sh's own (ros/.../target, firmware/.../target),
      # so a run rebuilds only our crates, not every dependency (the colcon build went from
      # 2208 to 3426 s on 16 Nov). Keyed on every Cargo.lock and pixi.lock (the compiler):
      # a new lock starts from the newest older cache. Not incremental/ (big, debug only).
      # Restored here, saved right after the build (below), so a run whose tests fail or
      # time out still leaves its build for the next: actions/cache saves only on success,
      # and on 18 Nov main's linux job built cold (27 of its 60 min), timed out in the
      # tests, saved nothing, and so the next run would build cold again.
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/*/target
            ros/*/*/target
            firmware/*/target
            !**/target/*/incremental
          key: rust-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'pixi.lock') }}
          restore-keys: rust-${{ runner.arch }}-${{ runner.os }}-
      # A cache from older code can hold rclrs's and rosidl_runtime_rs's build-script output
      # (the libraries to link, where they were): then a Rust node fails to link (20 Nov,
      # PR #34: aav_costmap, Linux and ARM, while the fork's own cache built it). Their
      # build scripts are cheap: run them again every time.
      - name: Drop the ROS Rust bindings' cached build-script output
        run: |
          rm -rf build/*/target/*/build/rclrs-* build/*/target/*/.fingerprint/rclrs-* \
                 build/*/target/*/build/rosidl_runtime_rs-* \
                 build/*/target/*/.fingerprint/rosidl_runtime_rs-*
      # The build on its own, with its own limit, so the tests keep their full 60 min.
      # pixi run test builds again first, but then nothing has changed (a minute or two).
      - name: pixi run build
        timeout-minutes: 45
        run: pixi run --locked build 2>&1 | tee build.log
      - name: Save the Rust cache, even if a later step fails
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/*/target
            ros/*/*/target
            firmware/*/target
            !**/target/*/incremental
          key: rust-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'pixi.lock') }}
      - name: pixi run test
        timeout-minutes: 60
        env:
          PYTEST_ADDOPTS: -o faulthandler_timeout=300
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        if: (failure() || cancelled()) && hashFiles('test.log', 'build.log') != ''
        # test.log, or build.log when the build step stopped first
        run: python3 tools/ci_annotate.py "$(if [[ -f test.log ]]; then echo test.log; else echo build.log; fi)" build
      - name: The failed packages' errors in full
        # colcon's console shows a linker's first line only; its log keeps the rest.
        if: failure() && hashFiles('build.log') != ''
        run: |
          for f in log/latest_build/*/stderr.log; do
            [ -s "$f" ] && { echo "== $f"; tail -n 80 "$f"; }
          done; true
      # The HUD's CMake skips it, with only a warning, where X11's headers are missing: so
      # check that both programs were built, and for ARM.
      - name: The HUD and the map window, built for ARM
        run: |
          for prog in hud map; do
            f=install/aav_hud/lib/aav_hud/$prog
            if [[ ! -x $f ]]; then
              echo "::error title=aav_hud::no $f: the HUD wasn't built (see its CMake warning)"
              exit 1
            fi
            kind=$(file -bL "$f")
            echo "$prog: $kind"
            if [[ $kind != *aarch64* ]]; then
              echo "::error title=aav_hud::$prog isn't an ARM program: $kind"
              exit 1
            fi
          done
      # Xvfb is a screen in memory; Mesa draws in software (no GPU here). --demo: pretend
      # data, no ROS. Each program saves a picture after 4 s and quits. ros2 run, as on the
      # car: ROS's setup puts the environment's libraries on the loader's path.
      - name: The HUD and the map window, drawn once
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          mkdir -p screens
          for prog in hud map; do
            if ! xvfb-run -a -s '-screen 0 1920x1080x24' pixi run --locked tools/ros.sh --local \
                 ros2 run aav_hud "$prog" --demo --screenshot "$PWD/screens/$prog.png" \
                 > "screens/$prog.log" 2>&1 || [[ ! -s screens/$prog.png ]]; then
              echo "::error title=aav_hud $prog drew no picture on ARM::$(tail -25 "screens/$prog.log" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
              exit 1
            fi
            # A notice, so the picture's size shows without signing in (all black: a few KB).
            echo "::notice title=aav_hud $prog on ARM::$(file -b "screens/$prog.png"), $(wc -c < "screens/$prog.png") bytes"
          done
      - name: Keep the pictures
        if: always() && hashFiles('screens/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: arm-screens
          path: screens/
          retention-days: 14

  # The car kit (docs/car-install.md) as the car uses it: made by pixi run car-kit, then
  # car_install.sh --all on 64-bit ARM Linux with no network at all (a network namespace
  # of its own), so a package or crate the kit forgot fails here, not in the car park.
  # Every push too: 6 min on 24 Oct (the kit 1 min, the offline install and build 4.5),
  # beside the tests, so a crate or package the kit can't carry fails the push that added it.
  # Twice: on Ubuntu 24.04, and on 22.04, the car's own OS (JetPack 6 on the Orin). The
  # 24.04 job keeps the check name `car-kit` (main's required check). The 22.04 one is new
  # (26 Oct) and allowed to fail until it has passed a few times: then drop continue-on-error.
  car-kit:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || github.repository != 'AAV-2025-2026/ecolo-av')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: car-kit
            os: ubuntu-24.04-arm
          - name: car-kit-22.04
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.name == 'car-kit-22.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the kit holds a git bundle of the history
      - name: Install Pixi
        run: |
          # GitHub's downloads fail now and then for a few seconds: try 5 times.
          for try in 1 2 3 4 5; do
            curl -fsSL https://pixi.sh/install.sh | bash && [ -x "$HOME/.pixi/bin/pixi" ] && break
            echo "pixi install failed (try $try), again in 20 s"; sleep 20
          done
          [ -x "$HOME/.pixi/bin/pixi" ]
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-arm64-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-arm64-${{ runner.os }}-
      - name: pixi run car-kit
        run: |
          # The bundle holds HEAD and main; a branch's checkout has no local main.
          git show-ref -q --verify refs/heads/main || git branch main HEAD
          df -h "$HOME" | tail -1
          pixi run --locked car-kit 2>&1 | tee car-kit.log
      # car_install.sh wants 13 GB free.
      - name: Make room
        run: |
          df -h "$HOME" | tail -1
          rm -rf .pixi vendor/car-kit-cache ~/.cache/rattler
          df -h "$HOME" | tail -1
      - name: car_install.sh --dry-run
        run: bash car-kit/car_install.sh --dry-run
      - name: car_install.sh --all, offline
        timeout-minutes: 30
        run: |
          # As the runner's own user (car_install.sh refuses root), in a network namespace
          # whose only network is its own loopback. sudo sets PSModulePath again (the
          # runner's /etc/environment): empty, or colcon picks PowerShell, see env above.
          sudo unshare --net -- sh -c "ip link set lo up && exec sudo -u $(id -un) -H env PATH='$PATH' PSModulePath= bash car-kit/car_install.sh --all" 2>&1 | tee car-install.log
          if grep -q "some packages didn't build" car-install.log; then
            grep -E '^(Failed|Aborted) +<<<|^Summary' "$HOME/aav-jazzy/build.log" || true
            exit 1
          fi
      - name: Failures as annotations (readable without signing in)
        if: failure() || cancelled()
        run: |
          log=car-install.log
          [[ -f $log ]] || log=car-kit.log
          python3 tools/ci_annotate.py "$log" "$HOME/aav-jazzy/aav/build"
      - name: The installed stack runs
        run: |
          ~/aav-jazzy/aav.sh ros2 pkg list > pkgs.txt
          echo "$(grep -c '^aav' pkgs.txt) of our packages installed"
          # The Rust nodes the car runs by default (16 Nov) too, not only the screens.
          for pkg in aav_bringup aav_hud aav_spine_bridge aav_ego_rs aav_behaviour_rs \
                     aav_watchdog_rs aav_localization_health_rs; do
            if ! grep -qx "$pkg" pkgs.txt; then
              echo "::error title=car kit::$pkg isn't installed"
              exit 1
            fi
          done
          file -bL ~/aav-jazzy/aav/install/aav_hud/lib/aav_hud/hud

  # Ravensim, headless: the car's whole graph, a drive, and a stop for a box (PLAN T2.6).
  # No GPU here: the cameras draw in software (tools/software_gl.sh), with Ravensim's clock
  # waiting for each picture (camera_lockstep:=auto, 16 Nov). New with Gazebo's removal and
  # not yet seen to pass here, so a failure doesn't turn the night red yet. Remove
  # continue-on-error once it has passed a few nights.
  sim:
    if: (github.event_name == 'schedule' && github.repository == 'AAV-2025-2026/ecolo-av') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          # GitHub's downloads fail now and then for a few seconds: try 5 times.
          for try in 1 2 3 4 5; do
            curl -fsSL https://pixi.sh/install.sh | bash && [ -x "$HOME/.pixi/bin/pixi" ] && break
            echo "pixi install failed (try $try), again in 20 s"; sleep 20
          done
          [ -x "$HOME/.pixi/bin/pixi" ]
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      - name: pixi run build
        run: pixi run --locked build
      # Ravensim with its cameras, drawn in software: Mesa's lavapipe through
      # tools/software_gl.sh, which also turns camera lockstep on (the clock waits for each
      # picture, so they get their full rate in sim time: 1.6 Hz free-running on 15 Nov).
      # The first run builds Bevy (minutes).
      - name: tools/software_gl.sh pixi run sim-check --obstacle
        env:
          AAV_SIM_LOG: ${{ github.workspace }}/sim-logs/aav-sim-check.log
          ROS_LOG_DIR: ${{ github.workspace }}/sim-logs/ros
        run: |
          mkdir -p sim-logs
          tools/software_gl.sh pixi run --locked sim-check --obstacle 2>&1 | tee sim-logs/sim.log
      # With no cameras at all (cameras:=false): the whole graph but the pictures, real time.
      - name: pixi run sim-check --no-cameras --obstacle
        if: always()
        env:
          AAV_SIM_LOG: ${{ github.workspace }}/sim-logs/aav-sim-check-no-cameras.log
          ROS_LOG_DIR: ${{ github.workspace }}/sim-logs/ros-no-cameras
        run: |
          mkdir -p sim-logs
          pixi run --locked sim-check --no-cameras --obstacle 2>&1 | tee sim-logs/sim-no-cameras.log
      # The cameras' picture tests (tests/render.rs: colours and edges where the lens says),
      # on lavapipe too. They pass on a Mac's lavapipe (15 Nov); new here.
      - name: The cameras' picture tests, in software
        if: always()
        run: tools/software_gl.sh pixi run --locked cargo test --release --manifest-path ros/sim/aav_sim_cameras/Cargo.toml --test render
      # Readable without signing in: sim-check's FAIL lines and the launch log's last errors.
      - name: Failures as annotations (readable without signing in)
        if: failure() && hashFiles('sim-logs/sim.log') != ''
        run: python3 tools/ci_annotate.py --sim sim-logs/sim.log sim-logs/aav-sim-check.log
      # Everything: sim-check's output, the launch log, each node's ROS log. Anyone can list
      # a public repo's artifacts (api.github.com/repos/AAV-2025-2026/ecolo-av/actions/artifacts),
      # but downloading one needs a GitHub sign-in (or a token).
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-logs
          path: sim-logs/
          retention-days: 14
          if-no-files-found: ignore
