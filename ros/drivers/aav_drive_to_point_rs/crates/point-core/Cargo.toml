[package]
name = "point-core"
description = "Drive to one point and stop there, without ROS: the Rust twin of aav_drive_to_point's approach.py, line.py, drive.py, rules.py and run.py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ego's crate (ours): the stopping law (stop_law:=hybrid), the car model, Python's own
# hypot and `g` format; reused, not copied.
ego-core = { path = "../../../../ego/aav_ego_rs/crates/ego-core" }

[dev-dependencies]
# Reads the shared vectors, tests/vectors.json (gen_vectors.py, from the Python modules).
# float_roundtrip: each number exactly as Python wrote it.
serde_json = { version = "1", features = ["float_roundtrip"] }
