[package]
name = "lane-follow-core"
description = "The lane follower without ROS: control_interface's states (the 2025-26 PID, ported) and the challengers, pure pursuit and Stanley on the fitted lane centre"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
# Reads the shared vectors, tests/vectors.json (gen_vectors.py, from lane_follow.py).
serde_json = { version = "1", features = ["float_roundtrip"] }
