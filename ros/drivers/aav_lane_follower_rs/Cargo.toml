[workspace]
resolver = "2"
# lane-follow-core: the follower's states and steering laws without ROS (aav_lane_geometry's
#   lane_follow.py, ported, and the challengers): cargo test -p lane-follow-core
# lane-follow-node: the ROS node (rclrs), binary `control_interface`. colcon builds it
#   through CMakeLists.txt.
members = ["crates/lane-follow-core", "crates/lane-follow-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
