# aav_track's own settings (docs/trials.md). navigation.launch.py adds the rest from
# nav2.yaml (the speed, the goal and progress checks: vehicle.track_params) and from
# vehicle.yaml (wheelbase, full lock, steering rate), so they aren't here.
track:
  ros__parameters:
    lateral_accel: 1.0        # m/s^2 sideways: slow for a bend (line.turn_speed_limit)
    odom_timeout: 1.0         # s without /localization/odom/local: give up the path
    # Follow in odom, correct slowly (TODO 186, slow_frame.py): the held map -> odom moves
    # toward the global EKF's newest at most this fast, measured at the car. A map path
    # stays in map; the car is brought there by the held one. The GPS's jitter (0.09 m
    # every 0.2 s in the sim) then never jumps the path under the car. 0: the old way
    # (each new path by the newest). navigation.launch.py map_correction:=newest sets 0.
    map_correction_speed: 0.1           # m/s: odometry drifts 1-2 % (0.05 m/s at 2.5 m/s)
    map_correction_turn_rate: 0.01745   # rad/s (1 degree/s): a GPS step turns up to 4 degrees
    map_correction_snap_distance: 2.0   # m: a bigger gap is a relocalisation: taken at once
    map_correction_snap_angle: 0.1745   # rad (10 degrees): likewise
    stanley:
      gain: 1.0               # k in atan(k e / (v_soft + v)), 1/s
      soft_speed: 1.0         # m/s
      yaw_rate_gain: 0.0      # off: Gazebo's yaw rate is clean, the car's isn't known yet
    lqr:
      q: [1.0, 2.0, 0.05]     # weights on e_y (m), e_theta (rad), delta - r (rad): r the bend's
      r: 0.2                  # on the command's distance from the bend's own steering (rad)
      r_rate: 100.0           # on each tick's change of command: with it the preview starts a
                              # swing from lock to lock in time for the steering's rate
      preview: 2.0            # s of the path's bends ahead
      min_speed: 0.5          # m/s: the gain table's first row
    mpc:
      horizon: 30             # ticks: 1.5 s at 20 Hz
      q: [1.0, 2.0, 0.05]     # as LQR's
      r: 2.0                  # on the command's distance from the bend's own steering
      r_rate: 1.0             # on each tick's change of command
      min_speed: 0.5          # m/s
    mpc_full:                 # speed and steering together; its limits are the policy's
      ds: 0.3                 # m a step: the plan is over distance
      horizon: 30             # steps: 9 m
      q: [1.0, 2.0, 0.05]     # as LQR's
      r: 0.2                  # on the command's distance from the bend's own steering
      r_rate: 1.0             # on each step's change of command
      q_speed: 0.2            # on (v^2 / cruise^2 - 1)^2: how much it minds going slower
    mpc_lag:                  # steering and set speed through the car's lags (vehicle.yaml's
                              # actuators: section); its limits are the policy's and ego's
      horizon: 30             # ticks: 1.5 s at 20 Hz
      q: [1.0, 2.0, 0.05]     # on e_y (m), e_theta (rad), wheels - r (rad)
      r: 0.2                  # on the command's distance from the bend's own steering
      r_rate: 1.0             # on each tick's change of steering command
      q_speed: 0.5            # on (v - the speed limit there)^2: how much it minds going slower
      r_speed: 0.5            # on each tick's change of set speed
      latency: 0.1            # s the ROS chain adds before the actuators (ego's 50 Hz ramp, the
                              # 20 Hz hold, the adapter): whole ticks, added to the dead times
      speed_loop: default     # the spine's speed loop it predicts: default or smooth (as
                              # sim.launch.py speed_loop:=; lqi isn't modelled)
