[package]
name = "lattice-planner"
description = "A State Lattice path planner for a car, ported from Nav2's nav2_smac_planner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Our costmap's grid, outline and inflation (aav_costmap), so both read costs the same way.
costmap = { path = "../../../aav_costmap/crates/costmap" }
# The lattice primitives file is JSON.
serde_json = "1"
# Our own Lanelet2 reader and its routing graph (aav_description), for lane_graph:=lanelet2
# (TODO 175).
lanelet-map = { path = "../../../../bringup/aav_description/lanelet-map" }
# TODO 214: the jerk-limited pass's QP (jerk_pass.rs). Apache-2.0 (Oxford). Its default
# feature (serde) only: without it, 0.11.1 doesn't build.
clarabel = "0.11.1"

# TODO 203: benchmarks (benches/plan.rs), never in the node's build.
[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The campus's lanes.yaml, read in a test (tests/lanelet2.rs).
serde_yaml_ng = "0.10"
# The map server's reading of a map file, for examples/teach.rs (the diffusion data's
# teachers, TODO 242).
map-chunks = { path = "../../../../bringup/aav_description/map-chunks" }

[[bench]]
name = "plan"
harness = false
