# joy (joystick_drivers 3.3.0, Jazzy): reads the stick, publishes sensor_msgs/Joy on /drivers/joy/joy.
# Axes are -1..1 with left and up positive; buttons are 0/1.
# See which index is which: ros2 run joy joy_enumerate_devices, then
#   ros2 topic echo /drivers/joy/joy   and move one control at a time.
/**/joy_node:                   # any namespace: teleop.launch.py puts it in /drivers/joy
  ros__parameters:
    device_id: 0                # first joystick; or set device_name instead
    device_name: ""
    deadzone: 0.10              # the stick's centre 10 % reads 0 (let go): with the pedal
                                # (TODO 206) a resting thumb must not creep or brake. Ben,
                                # 20 Nov; a guess to tune on the car (0.05: the 2025-26 value)
    autorepeat_rate: 20.0       # Hz: resend while held, so teleop keeps publishing
    sticky_buttons: false
    coalesce_interval_ms: 1
