[package]
name = "legacy-node"
description = "legacy_uart_bridge: ego's commands to the 2025-26 ESP32 over UART, and its uplink back, as ROS 2 topics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "legacy_uart_bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
legacy-bridge = { path = "../legacy-bridge" }
legacy-link = { path = "../../../../../firmware/spine/crates/legacy-link" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
# No libudev (default-features off): builds on macOS and on the Pis without it, as
# aav_imu_yahboom's imu-node.
serialport = { version = "4", default-features = false }
