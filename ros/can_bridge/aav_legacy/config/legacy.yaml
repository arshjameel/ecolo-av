# Interim backend for the 2025-26 hardware (ESP32 over UART, Pico 2 wheel encoder over UDP).
# Values marked TODO must be checked with the wheels off the ground before driving.
legacy_uart_bridge:
  ros__parameters:
    port: /dev/ttyAMA0          # the Pi's UART wired to the ESP32 (GPIO16/17 on the ESP32 side)
    baud: 115200
    rate_hz: 50.0
    cmd_timeout: 0.3
    # The serial frame (TODO 50; docs/rust-firmware.md, "The heartbeat"). 1 while the car's
    # ESP32 runs the 2025-26 C++, which reads only the 13-byte frame: a version 2 stream
    # can be misread by its resync. 2 the day the Rust firmware is flashed
    # (docs/esp32-bench.md): it carries the Orin's counter, and the ESP32 brakes 100 ms
    # after it stops changing. The bridge's own default is 2.
    frame_version: 1
    # With frame_version 1 (no firmware timeout) the bridge says true on
    # /safety/legacy_uart_bridge/lock: twist_mux's no_timeout lock (priority 60) holds every
    # program (scripted, replay, point, Nav2, AI); people and the actuator tests still drive.
    # true lifts it: ONLY for a supervised stand, wheels off the ground, a person at the e-stop.
    allow_programs_without_timeout: false
    # The ESP32's uplink frames, back on the same port (TODO 50, 48): /vehicle/status,
    # steering, brake and /vehicle/rc (the RC's mode switch and sticks, for rc_driver).
    # false until the hardware lead confirms the wire from the ESP32's TX1 (GPIO17) to the
    # Pi's RX, and the Rust firmware is flashed with --features uplink (docs/esp32-bench.md).
    uplink: false
    uplink_timeout: 0.2         # s without a frame: the uplink is stale (they come at 50 Hz)
    max_steering_angle: 0.5     # rad at full lock. TODO measure
    # TODO check: +1 must steer RIGHT for this to be -1. The 2025-26 joystick config had
    # invert_steer: true (joy_teleop_ackerman/config/joy_params.yaml), which suggests the
    # ESP32 takes +1 as right. ROS uses + = left (REP-103).
    steering_sign: -1.0
    full_throttle_speed: 3.0    # m/s at speed = 1.0 (throttle is open loop). TODO measure
    stop_speed: 0.05
    hold_brake: 0.3
    stop_brake: 1.0
    # How ego's speed becomes throttle and brake (docs/designs/2026-10-27_control-plan.md):
    #   open  the 2025-26 mapping above: speed / full_throttle_speed, the brake only
    #         below stop_speed. The car's setting until pi is tried on stands
    #   pi    speed_control: feed-forward from ego's speed profile plus PI on the wheel
    #         speed (/vehicle/odom), out as throttle OR brake. The model's max_accel,
    #         max_brake and drag come from vehicle.yaml's actuators: (legacy.launch.py)
    speed_loop.mode: open
    speed_loop.kp: 2.0              # m/s^2 per m/s. GUESS: tune on stands, then the lot
    speed_loop.ki: 0.5              # m/s^2 per (m/s x s). GUESS
    speed_loop.response_lag: 0.3    # s the car runs behind ego (the actuators' lag). GUESS
    speed_loop.hold_brake: 0.2      # brake travel while stopped (about -0.3 as above)
    speed_loop.smooth_stop_speed: 0.3  # m/s: the smooth stop (Autoware's design); 0: off
    speed_loop.stopped_brake: 0.5   # brake held once stopped by the smooth stop. GUESS
    speed_loop.odom_timeout: 0.3    # s: an older wheel speed means feed-forward alone

encoder_udp:
  ros__parameters:
    port: 10111
    bind_address: 0.0.0.0
    wheel_diameter: 0.30        # TODO measure (keep equal to vehicle.yaml)
    counts_per_rev: 8
    window_s: 0.5
    timeout_s: 0.3              # no packet for this long: stop publishing (they come every 0.1 s)
    speed_variance: 0.05
