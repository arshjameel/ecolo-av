[package]
name = "io-mux-core"
description = "The sensor mux's and the output mux's logic, no ROS: the Rust twin of aav_io_mux's provenance.py, heartbeat.py and muxes.py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ego's crate (ours): Python's `format(x, 'g')`; reused, not copied (as aav_watchdog_rs).
ego-core = { path = "../../../../ego/aav_ego_rs/crates/ego-core" }

[dev-dependencies]
# float_roundtrip: read each number exactly as Python wrote it (the default may be 1 bit off).
serde_json = { version = "1", features = ["float_roundtrip"] }
