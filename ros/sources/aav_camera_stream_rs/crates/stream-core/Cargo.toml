[package]
name = "stream-core"
description = "One camera's H.264 stream to pictures, no ROS: aav_camera_stream's decoder command lines, pipe, newest frame, rates, lens and time code, ported"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Stopping the decoder's whole process group (killpg), as the Python's os.killpg.
# MIT OR Apache-2.0.
libc = "0.2"
# The preview's JPEG, in plain Rust. (MIT OR Apache-2.0) AND IJG.
jpeg-encoder = "0.7"
# camera_info_manager's calibration YAML. MIT OR Apache-2.0, as other packages here use.
serde_yaml_ng = "0.10"

[dev-dependencies]
# The Python's numbers read exactly. MIT OR Apache-2.0.
serde_json = { version = "1", features = ["float_roundtrip"] }
