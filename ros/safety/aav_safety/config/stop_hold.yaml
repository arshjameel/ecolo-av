# stop_hold (aav_safety): holds the stop zone's stops. navigation.launch.py starts it
# wherever it starts the stop zone (aav_stop_zone). Its lock is twist_mux's stop_zone (priority 21).
stop_hold:
  ros__parameters:
    clear_time: 1.0     # s the monitor must say "go" without a break before navigation may go:
                        # 10 radar frames in a row with the zone clear
    rate_hz: 10.0       # Hz of /safety/stop_hold/lock
