# sensor_watchdog: every input it knows, and how to watch each (aav_safety watchdog.py says
# what each check means). The launch file picks which inputs run (`inputs`, passed by
# watchdog.launch.py: not set here, or this file's value would win over the launch's;
# docs/conventions.md, "A launch override that silently loses").
#
#   stop: true   the input is one Nav2 or the AI slot needs: while it isn't OK, twist_mux's
#                sensors lock holds them (people and tests still drive)
#   stop: false  only said loudly: the log, /diagnostics, the HUD
#
# The ages: about 5 messages at each sensor's rate, and never less than ego's own 0.5 s
# command timeout. The GPS gets 2 s: a receiver drops a fix now and then, and the EKF
# carries on from the wheels and the IMU meanwhile.
sensor_watchdog:
  ros__parameters:
    rate_hz: 10.0
    odom:                       # the wheels' speed: the EKFs' only speed
      topic: /vehicle/odom
      kind: odom
      max_age: 0.5
      stop: true
      # The wheels against the IMU (/sensors/imu/data) and the GPS, to catch a frozen
      # wheel speed: wheel_check.py. Tuned in Gazebo only: on the car, read the worst_*
      # gaps on /diagnostics after a normal drive, and keep the tolerances well above.
      cross_check: true
      cross_window: 1.5         # s
      cross_speed_tolerance: 0.3  # m/s: the wheels' change in speed vs the IMU's
      cross_yaw_tolerance: 0.15   # rad/s: the wheels' turn rate vs the gyro's
      cross_persist: 1.0        # s a gap must last
      # The GPS: a long window, so a tight tolerance. Nav2's MPPI plans from the wheels'
      # speed, so frozen wheels keep the car only 0.1-0.2 m/s faster than they say: 0.3
      # never caught that (24 Oct). Gazebo, normal driving, worst gap: 0.14 m/s over 6 s,
      # 0.05 over 10 s (230 s of driving, replayed).
      cross_gps_window: 10.0    # s of fixes (5 Hz in Gazebo): the speeds of fitted lines
      cross_gps_tolerance: 0.15  # m/s: the wheels' vs the GPS's
    imu:                        # the filtered IMU: the EKFs' turn rate
      topic: /sensors/imu/data
      kind: imu
      max_age: 0.5
      stop: true
      frozen_after: 1.0         # a real IMU's noise never repeats exactly
    gps:
      topic: /sensors/gps/fix
      kind: gps
      max_age: 2.0
      stop: true
      max_jump_speed: 15.0      # m/s: the car can't; a bad fix can (latched: clear it)
      jump_margin: 5.0          # m more: two noisy fixes 0.2 s apart can be 2.5 m apart
    # NDT leads, the GPS checks (pose_source:=ndt, TODO 210): sim.launch.py watches these
    # two in place of gps. The GPS's own checks, said loudly but holding nothing: a silent,
    # NaN or jumped GPS no longer moves the pose (pose_check holds it out of ekf_global).
    # pose_check's own say stops instead: ERROR is HOLD (neither NDT nor the GPS trusted),
    # and its silence (a dead pose_check) stops too.
    gps_check:
      topic: /sensors/gps/fix
      kind: gps
      max_age: 2.0
      stop: false
      max_jump_speed: 15.0
      jump_margin: 5.0
    pose_check:                 # 10 Hz
      topic: /localization/pose_check/status
      kind: status
      status_name: pose_check
      min_level: 2
      max_age: 1.0
      stop: true
    local:                      # ekf_local: Nav2's odometry
      topic: /localization/odom/local
      kind: odom
      max_age: 0.5
      stop: true
    global:                     # ekf_global: where the car is on the map
      topic: /localization/odom/global
      kind: odom
      max_age: 0.5
      stop: true
    camera:                     # the front left camera: stop signs, lane keeping
      topic: /sensors/camera/front_left/image_raw
      kind: image
      max_age: 1.0
      stop: true
      frozen_after: 1.0         # only while the wheels turn: a still car sees a still picture
    # The car's front cameras, through their camera_stream nodes (aav_camera_stream): the
    # pictures stay inside each node, which sends its detections for every picture (15 a
    # second, boxes or none) on one shared topic. Silent 1 s: the camera Pi's stream, the
    # decoder or the detector stopped. Watched where car.launch.py starts the streams.
    front_left_stream:
      topic: /perception/detections
      kind: detections
      frame_id: camera_left_link  # only this camera's messages count
      max_age: 1.0
      stop: true
    front_right_stream:
      topic: /perception/detections
      kind: detections
      frame_id: camera_right_link
      max_age: 1.0
      stop: true
    hud:                       # the HUD's screen (aav_hud): the safety drivers watch
      topic: /hud/heartbeat     # it, so a frozen or dead screen stops Nav2 and the AI slot.
      kind: heartbeat           # Watched only where the launch expects a HUD (watch_hud)
      max_age: 1.0              # 10 beats: a slow frame of a second or more is a dropout
      stop: true
      frozen_after: 1.0         # beats whose frame count stopped rising
      # A HUD that keeps crashing holds Nav2 until a person clears it (Ben, 24 Oct): a
      # dropout latches LOST, even once it beats again; `pixi run clear watchdog`. One
      # dropout within 5 s of its first beat is forgiven: the window starting up.
      latch: true
      latch_grace: 5.0          # s
    steering:                   # the steering asked against the steering measured (TODO 207)
      topic: /vehicle/steering
      kind: actuator
      max_age: 1.0
      stop: true
      # Stuck: more than 0.15 rad (8.6 degrees) off its command for 1 s, latched until a
      # person clears it. Ego ramps the command at the steering motor's rate, so a working
      # motor stays within a few hundredths. NaN on a side (the car's legacy uplink) means
      # no check, not a fault. Tuned in the sim only (TODO 159's stuck steering).
      follow_tolerance: 0.15    # rad
      follow_persist: 1.0       # s
    speed:                      # ego's speed against the wheels' (TODO 207, a stuck throttle)
      topic: /ego/actuator_cmd  # the measured speed: /vehicle/odom, which the node reads anyway
      kind: speed
      max_age: 1.0              # ego sends at 50 Hz, also while still
      stop: true
      # More than 0.2 m/s over the command while not slowing (falling under 0.3 m/s^2 over
      # 0.5 s): a warning (OVER) after 1 s, OVERSPEED after 2 s, latched until a person
      # clears it. From the car model (TODO 163): the default loop's overshoot is 0.14 m/s
      # at 1 m/s and 0.20 at 2.5 (+14 %, +8 %), and a healthy stop lags its command by up to
      # 0.7 m/s but is slowing all the while; never OVER in any loop profile
      # (test_watchdog.py). A throttle stuck while speeding up holds 1.25 m/s for 1.0.
      # Tuned on the model and in the sim only.
      over_margin: 0.2          # m/s
      over_warn: 1.0            # s
      over_persist: 2.0         # s
      over_slowing: 0.3         # m/s^2
    lidar:                      # the roof VLP-16, 10 Hz: the stop zone's and costmap's eyes
      topic: /sensors/lidar/points
      kind: cloud
      max_age: 1.0              # as the camera's (also 10 Hz): 10 clouds, well over 0.5 s
      stop: true                # as the camera: a dead lidar holds Nav2 and the AI slot
      # The same cloud again for 1 s while the wheels turn: a driver stuck, resending its
      # last cloud with fresh stamps (the CRC of a sample of its bytes, as a picture's).
      # Only while moving: the bench's pretend lidar has no noise, so a still car there
      # sees the same cloud. Watched only where a lidar runs (launches: lidar:=true).
      frozen_after: 1.0
    radar:                      # the stop zone stops navigation itself when it goes quiet
      topic: /sensors/radar/points
      kind: cloud
      max_age: 1.0
      stop: false
    # Our own nodes (Ben, 14 Nov: warn only, no lock): kind node, topic = the node's full
    # name, looked for in the ROS graph each tick. Each respawns 1 s after it dies, so 3 s
    # gone is a node that keeps dying or hangs. sim.launch.py adds the ones it starts.
    node_costmap: {topic: /costmap, kind: node, max_age: 3.0, stop: false}
    node_planner: {topic: /planner, kind: node, max_age: 3.0, stop: false}
    node_navigator: {topic: /navigator, kind: node, max_age: 3.0, stop: false}
    node_mppi_lag: {topic: /mppi_lag, kind: node, max_age: 3.0, stop: false}
    node_smoother: {topic: /velocity_smoother, kind: node, max_age: 3.0, stop: false}
    node_behaviour: {topic: /behaviour, kind: node, max_age: 3.0, stop: false}
    node_voxels: {topic: /voxels, kind: node, max_age: 3.0, stop: false}
    node_things: {topic: /things, kind: node, max_age: 3.0, stop: false}
    node_ego: {topic: /ego, kind: node, max_age: 3.0, stop: false}
    node_look_ahead: {topic: /look_ahead, kind: node, max_age: 3.0, stop: false}
    # Our navigation nodes in their own words (Ben, 18 Nov: warn only, TODO 171): kind
    # status, a DiagnosticStatus topic. FAULT while the newest message says min_level or
    # worse (1 WARN, 2 ERROR); STALE when it goes silent for max_age, unless quiet_ok (the
    # node speaks only while it works). stop: true is the switch to hold Nav2 and the AI
    # slot on one later; false for now, as respawn, mppi_lag's costmap age and twist_mux's
    # timeout already stop the car. The ages: a few messages at each one's rate. The
    # smoother has no status topic: node_smoother watches it in the graph only.
    status_costmap_local:       # 2 Hz; WARN while it waits for odometry, /tf, a sensor
      topic: /drivers/nav/costmap/status
      kind: status
      status_name: costmap local
      min_level: 1
      max_age: 3.0
      stop: false
    status_costmap_global:      # 1 Hz; WARN while it waits for the map
      topic: /drivers/nav/costmap/status
      kind: status
      status_name: costmap global
      min_level: 1
      max_age: 5.0
      stop: false
    status_planner:             # one a plan; ERROR when it finds none
      topic: /drivers/nav/planner/status
      kind: status
      min_level: 2
      quiet_ok: true
      max_age: 3.0
      stop: false
    status_navigator:           # 2 Hz always; WARN while recovering is normal
      topic: /drivers/nav/navigator/status
      kind: status
      min_level: 2
      max_age: 2.0
      stop: false
    status_mppi_lag:            # 20 Hz while it follows a path; WARN: a tick ran late
      topic: /drivers/nav/track/status
      kind: status
      status_name: track
      min_level: 1
      quiet_ok: true
      max_age: 1.0
      stop: false
