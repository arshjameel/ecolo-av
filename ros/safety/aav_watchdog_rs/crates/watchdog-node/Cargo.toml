[package]
name = "watchdog-node"
description = "The sensor watchdog in ROS 2: twist_mux's sensors lock, its state, /diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sensor_watchdog"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
watchdog-core = { path = "../watchdog-core" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
