[package]
name = "watchdog-core"
description = "The sensor watchdog's logic, no ROS: the Rust twin of aav_safety's watchdog.py and wheel_check.py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ego's crate (ours): Python's own hypot and `format(x, 'g')`; reused, not copied.
ego-core = { path = "../../../../ego/aav_ego_rs/crates/ego-core" }

[dev-dependencies]
# float_roundtrip: read each number exactly as Python wrote it (the default may be 1 bit off).
serde_json = { version = "1", features = ["float_roundtrip"] }
