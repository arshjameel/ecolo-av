[package]
name = "joy-alive-node"
description = "joy_alive: pass /drivers/joy/joy on as joy_checked only while the joystick is really there and moving"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "joy_alive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
joy-alive-core = { path = "../joy-alive-core" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
