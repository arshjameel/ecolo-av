[workspace]
resolver = "2"
# detector-core: RF-DETR's picture in, boxes out, in plain Rust (no ROS). The maths always;
# the model through ONNX Runtime (the ort crate) with --features ort:
#   cargo test -p detector-core                       the maths: resize, normalise, decode
#   cargo test -p detector-core --features ort        and the model on saved pictures
#   cargo run --release -p detector-core --features ort,coreml --example timing
# detector-node: the ROS node (rclrs), binary detector. colcon builds it through CMakeLists.txt.
# onnx-session: the session builder every model shares (the diffusion planner's too):
# the provider by name, its cache, its share of the graph.
#   cargo run --release -p onnx-session --features coreml --example measure -- <model.onnx>
members = ["crates/onnx-session", "crates/detector-core", "crates/detector-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# The parity tests run the model: build them optimised.
[profile.test]
opt-level = 3
