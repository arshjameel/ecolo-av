[package]
name = "detector-node"
description = "detector: RF-DETR's ONNX on the camera's pictures, as ROS 2 topics (a drop-in for aav_detector's Python node)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "detector"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
detector-core = { path = "../detector-core", features = ["ort"] }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"

# A Mac: Core ML too (its GPU).
[target.'cfg(target_os = "macos")'.dependencies]
detector-core = { path = "../detector-core", features = ["ort", "coreml"] }

[features]
# The Orin: cargo build --features tensorrt (CMake: -DDETECTOR_FEATURES=tensorrt). Untested.
cuda = ["detector-core/cuda"]
tensorrt = ["detector-core/tensorrt"]
