# aav_things' things node (navigation.launch.py things:=true). Units: m, s, m/s.
things:
  ros__parameters:
    rate: 10.0              # Hz: /world/things
    # Grouping (groups.py GroupShape)
    size: 0.25              # m: aav_voxels' cube (nav2.yaml voxels.size)
    gap: 0.6                # m: cubes this close make one thing
    min_cubes: 2            # fewer is noise
    max_size: 8.0           # m: longer is a wall or a building, not a thing
    # The tracker (tracker.py TrackerShape)
    gate: 2.0               # m: farther is another thing
    position_noise: 0.15    # m: a group's middle, one sigma
    accel_noise: 1.5        # m/s²: how hard a thing may change speed, one sigma
    radar_noise: 0.3        # m/s: the radar's speed along its ray, one sigma
    radar_gate: 2.0         # m
    confirm: 3              # clouds seen before it is listed and remembered
    keep: 3.0               # s unseen before a thing is forgotten
    keep_blind: 30.0        # s, within blind_range of the car (the lidar can't see low there)
    blind_range: 4.0        # m from base_link
    keep_tentative: 0.3     # s, a thing seen fewer than confirm times
    start_speed_sigma: 3.0  # m/s
    still_speed: 0.5        # m/s: slower, an unseen thing is taken as parked
    # TODO 222: no hopping between thin posts. A group must fit the thing's own
    # uncertainty, its shape, and (a small thing) a walker's top speed.
    gate_chi2: 9.21         # Mahalanobis distance², over: another thing (99 %, 2 dof)
    shape_ratio: 2.5        # a footprint this many times larger or smaller ...
    shape_slack: 0.6        # m: ... and this much apart: another thing
    small_size: 0.8         # m: a thing no wider is small (a post, a person) ...
    small_speed: 3.5        # m/s: ... and never faster than this
    small_slack: 0.3        # m: a small thing's middle may wander this much a look
    # The saved map as background (background.py, TODO 175 step 5): cubes under 0.7 m on
    # /map's walls, grown by the slack for pose error, are not things. Its switches,
    # `background` and `background_below`, are the launch's things_background:= (true) and
    # things_background_below:= (0.7), never here: a node's own block in this file outranks
    # the launch's /** parameters, so a value here would always win.
    background_slack: 0.25  # m
    background_min_z: 0.3   # m, map frame: NDT chunk points lower are the ground, not walls
