[workspace]
resolver = "2"
# ufld-core: the learned lane finder's maths, no ROS: the picture into the model's input,
#   the row anchors' answers into points, the points onto the ground, the lines and the
#   lane (lane-core's fit and lane_from). The model through ONNX Runtime with --features ort:
#   cargo test -p ufld-core                     the maths
#   cargo test -p ufld-core --features ort      and the model, if models/lane-ufld.onnx is made
# ufld-node: the ROS node (rclrs), binary `lane_finder`. colcon builds it through CMakeLists.txt.
members = ["crates/ufld-core", "crates/ufld-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "TODO"
publish = false

[profile.test]
opt-level = 3
