[package]
name = "voxels-node"
description = "voxels: the roof lidar's cloud as 0.25 m cubes over the fitted road, as ROS 2 topics"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "voxels"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
voxels = { path = "../voxels" }
