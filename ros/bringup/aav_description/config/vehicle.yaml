# The car's measurements: the one place they live.
#
# Read by:
#   urdf/aav.urdf.xacro          -> TF frames for every sensor (robot_state_publisher)
#   aav_bringup launch files     -> ego (wheelbase, steering limit, reverse speed, and its body:
#                                   mass, track, centre of mass, tyre grip, actuators), aav_spine
#                                   (wheelbase, track), aav_legacy encoder (wheel diameter),
#                                   Nav2 (footprint, minimum turning radius, reverse speed)
#   firmware/spine (spine-core)  -> keeps copies of the steering limit and the reverse speed;
#                                   ros/bringup/aav_description/test/test_vehicle.py checks them
#
# Units: metres and radians. base_link = on the ground under the centre of the rear
# axle; x forward, y left, z up (REP-103, REP-105). Measure everything from there.
# View the result: ros2 launch aav_description view.launch.py (see docs/car_measurements.md)
#
# Physical audit measurements were taken in centimetres and converted to metres here.
# Sensor mount measurements remain provisional until the mounts are frozen and
# verified against the physical car and in RViz.
#
# TODO values came from the previous teams' code or are guesses.
# Replace them with verified measurements when available.

vehicle:
  wheelbase: 1.561          # MEASURED: 156.1 cm, rear wheel centre -> front wheel centre

  track: 0.75               # PROVISIONAL: average of measured front=0.650 m, rear=0.850 m

  wheel_diameter: 0.36      # PROVISIONAL: tape-measured; verify with the rollout test
                            # (docs/measure-the-car.md M3). Loaded radius 0.210 m
                            # would give 0.420 m

  wheel_width: 0.10         # TODO measure

  max_steering_angle: 0.50  # rad, virtual wheel at the middle of the front axle. TODO measure;
                            # old code says 0.45 (bridge_params.yaml:10) to 0.55
                            # (temp_steer_2_P_only.py:29)

  max_reverse_speed: 0.50   # m/s backwards, for every driver: ego, Nav2 and the spine.
                            # Slow on purpose: the radar faces forward, so reversing is blind
                            # (docs/learn-nav2.md)

  body:
    length: 2.00            # bumper to bumper. TODO measure
                            # obstacle_avoidance.cpp:44 guessed 2.0

    width: 1.00             # TODO measure
                            # obstacle_avoidance.cpp:43 guessed 1.4

    height: 1.50            # TODO measure

    rear_overhang: 0.20     # rear bumper behind the rear axle. TODO measure

  # Ground clearance measured during audit: 0.220 m.
  # No ground_clearance field is currently consumed by this schema.

  mass: 181.0               # kg: Ben's estimate, about 400 lb (15 Oct). TODO weigh.
                            # Was 272, a CARLA stand-in; the 2025-26 braking model used 60
  centre_of_mass:           # empty car (docs/car_measurements.md, "Weight and balance")
    x: 0.70                 # m ahead of the rear axle. GUESS: TODO M7, wheelbase x front / total
    height: 0.55            # m above the ground. GUESS: TODO M7b, the rear lifted
  tyre_grip: 0.7            # g: the most the tyres push before they slide. GUESS (dry asphalt
                            # 0.7-0.9): TODO test 4.3, if full brake skids the wheels
  encoder_counts_per_rev: 8 # spokes on the encoder wheel (Wheel_Encoders wiznet.ino:29)
  speed_wheels: front       # which wheels /vehicle/odom measures: front (the Arduino's two
                            # sensors, docs/learn-speed.md) or rear. The car is rear-wheel
                            # drive, so on stands only "rear" sees the motor: the preflight
                            # drives the real car only then. TODO 49b, the hardware lead

  centre_of_mass:
    x: 0.70                 # m ahead of rear axle. GUESS: TODO measure
    height: 0.55            # m above ground. GUESS: TODO measure

  tyre_grip: 0.7            # g. GUESS: TODO test on real car

  encoder_counts_per_rev: 8 # spokes on encoder wheel
                            # (Wheel_Encoders wiznet.ino:29)


# How the car answers its commands: the actuator model in Gazebo.
# Units: m/s^2, s, rad, 1/s; throttle and brake 0..1.
#
# These values are still guesses and must be measured on the real car.
# See docs/tests.md and docs/actuator-tests.md.

actuators:
  max_accel: 1.5          # m/s^2 at full throttle, on the flat. GUESS: TODO tests 4.1, 4.4
  throttle_deadband: 0.0  # throttle below which the car doesn't move. GUESS: TODO test 4.4
  throttle_lag: 0.1       # s: the throttle's response (first order). GUESS: TODO test 4.1
  max_brake: 3.0          # m/s^2 at full brake. GUESS: TODO test 4.3
  brake_lag: 0.2          # s: the brake actuator's response. GUESS: TODO test 4.3
  drag: 0.1               # 1/s: coasting, m/s lost per second per m/s. GUESS: TODO test 4.2
  steer_rate: 0.8         # rad/s: the steering motor's top speed (spine_sim's). GUESS: TODO test 3.11
  steer_lag: 0.1          # s: the linkage after the motor. GUESS: TODO tests 3.11, 4.5
  steer_offset: 0.0       # rad, + left: the wheels' angle when told straight. GUESS: TODO test 3.12
  steer_deadband: 0.005   # rad: a smaller change doesn't move the motor. GUESS: TODO test 3.10
  # Dead times: how long each actuator waits before it starts to move, ahead of its lag.
  # Not measured, so not set: the model takes 0. The actuator tests print a line only when
  # the data resolves it (docs/actuator-tests.md). Examples of the form, NOT values:
  # throttle_dead_time: 0.0   # s. GUESS placeholder: TODO test 4.1
  # brake_dead_time: 0.0      # s. GUESS placeholder: TODO test 4.3
  # steer_dead_time: 0.0      # s. GUESS placeholder: TODO test 3.11
  # How the car stops with legacy_uart_bridge's speed_loop.mode open (it brakes only below
  # stop_speed). Not measured, so not set: the geofence holds every program (COASTING)
  # until it is (aav_safety geofence.py coasts). Example of the form, NOT a value:
  # open_loop_decel: 0.0      # m/s^2, the average from 1 m/s to a stop. TODO test 4.3


# Sensor mounts, relative to base_link.
# xyz in metres, rpy in radians.
#
# xyz values marked MEASURED came from the physical vehicle audit.
# They remain PROVISIONAL until mount positions are frozen and verified
# against the physical vehicle and in TF/RViz.

sensors:
  imu_link:
    xyz: [0.49, 0.00, 1.44]   # MEASURED / PROVISIONAL: [49, 0, 144] cm
    rpy: [0.0, 0.0, 0.0]      # TODO verify IMU orientation

  gps_link:
    xyz: [0.00, 0.00, 1.40]   # over the rear axle (Ben, 23 Oct; confirmed 31 Oct);
                               # z MEASURED / PROVISIONAL: 140 cm. Antenna, not
                               # receiver box. The 31 Oct audit's x = 25 cm was wrong
    rpy: [0.0, 0.0, 0.0]      # TODO verify if orientation/heading is relevant

  radar_link:
    xyz: [1.80, 0.00, 0.45]   # TODO physically measure relative to base_link
    rpy: [0.0, 0.0, 0.0]      # TODO verify orientation

  camera_left_link:
    xyz: [1.75, 0.29, 1.55]   # TODO complete measurement
                               # measured x candidate = 0.810 m
    rpy: [0.0, 0.0, 0.0]      # TODO calibrate / verify orientation

  camera_right_link:
    xyz: [1.75, -0.29, 1.55]  # TODO physically measure
    rpy: [0.0, 0.0, 0.0]      # TODO calibrate / verify orientation

  camera_rear_link:
    xyz: [-0.20, 0.00, 0.90]  # TODO physically measure
    rpy: [0.0, 0.0, 3.14159265]

  lidar_link:
    xyz: [0.49, 0.00, 1.52]   # MEASURED / PROVISIONAL:
                               # x=49 cm, y=0 cm, z=133+19=152 cm
    rpy: [0.0, 0.0, 0.0]      # TODO verify orientation in RViz / calibration