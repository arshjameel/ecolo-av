[package]
name = "health-node"
description = "localization_health in ROS 2: warn-only checks on localization's inputs and outputs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "localization_health"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
health-core = { path = "../health-core" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
# vehicle.yaml's wheelbase and track.
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
