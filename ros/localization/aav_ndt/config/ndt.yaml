# aav_ndt's node, ndt: how it filters the lidar and matches it to the map. The car's own
# measurements (the lidar's mount, the body's outline) come from vehicle.yaml through
# launch/ndt.launch.py; the map file and the start pose are launch arguments.
# The numbers' reasons: docs/designs/2026-10-29_ndt.md and ndt-core's README.
ndt:
  ros__parameters:
    cubes: [4.0, 2.0, 1.0]      # m, biggest first: the 4 m cubes pull in a start 1.5 m off
    ground: above               # above: flat ground (Gazebo); lowest: per ground_cell (the car)
    min_height: 0.3             # m above base_link (or the cell's lowest point)
    ground_cell: 1.0            # m
    max_range: 45.0             # m from base_link, flat
    thin: 1.0                   # m: one point per cube of the scan
    min_score_per_point: 2.3    # below: a poor fit. Gazebo, 30 Oct (3 lot tours, 5,852 good
                                # fits): every good fit scored 2.6 or more (1 % under 2.7); a
                                # wrong one on the made-up lot 1.2. Fit again on the car
    max_correction_m: 0.5       # while tracking, a fit further than this from the guess (last
    max_correction_deg: 5.0     # good pose moved on by the local EKF) is poor: a jump. Not
                                # after a start or a restart, which may be off by more
    lost_after: 5               # poor fits in a row, then LOST and a restart from ekf_global
    max_iterations: 30          # Newton steps per cube size
    step_m: 0.1                 # the step cap
    step_deg: 2.0
    outlier_ratio: 0.55         # Autoware's
    covariance_scale: 7.5       # k in k(-H^-1). Gazebo, 30 Oct: k = 7.5 makes the good fits'
                                # mean NEES 3 (median 2.4: honest), with the floors below
    variance_floor_xy: 2.5e-5   # m^2: (5 mm)^2. Was (2 cm)^2: it hid k (typical fits 1 cm off)
    variance_floor_yaw: 3.05e-6 # rad^2: (0.1 deg)^2
    cloud_period: 0.1           # s: the lidar's 10 Hz, to count dropped clouds
