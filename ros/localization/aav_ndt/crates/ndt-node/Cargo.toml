[package]
name = "ndt-node"
description = "ndt: NDT on a saved lidar map as a ROS 2 node, the lidar and the local EKF in, the pose and its status out"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ndt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
ndt-core = { path = "../ndt-core" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
