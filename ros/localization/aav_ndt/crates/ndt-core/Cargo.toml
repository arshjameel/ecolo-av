[package]
name = "ndt-core"
description = "NDT scan matching on a saved lidar map, in x, y and yaw, without ROS: the map's cubes, the score and its derivatives, Newton with a line search, the scan filters, the guess from odometry, and when it is lost"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Apache-2.0 (docs/designs/2026-10-28_research-picks.md): 3x3 matrices, eigenvalues.
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
# Ours: the map's fixed 64 m chunks (TODO 175 step 4), shared with the planner and the things.
map-chunks = { path = "../../../../bringup/aav_description/map-chunks" }
# Ours: a PointCloud2's bytes, shared by every crate that reads a cloud (TODO 176).
cloud-view = { path = "../../../../bringup/aav_description/cloud-view" }

# TODO 203: benchmarks only (benches/align.rs).
[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "align"
harness = false
