[package]
name = "gps-heading-node"
description = "gps_heading: the car's heading from the GPS receiver's velocity, for the global EKF"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gps_heading"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
gps-heading-core = { path = "../gps-heading-core" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
# vehicle.yaml's gps_link, where the antenna sits.
serde_yaml_ng = "0.10"
