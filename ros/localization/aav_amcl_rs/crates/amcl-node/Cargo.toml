[package]
name = "amcl-node"
description = "amcl: AMCL as a ROS 2 node, with stock nav2_amcl's topics and parameters: the scan, the map and the local EKF in, the pose and the particles out; never TF"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "amcl"
path = "src/main.rs"

[dependencies]
amcl-core = { path = "../amcl-core" }
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
