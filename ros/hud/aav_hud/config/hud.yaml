# hud: the in-car screen (aav_hud). Every topic name it uses lives here, not in
# the code: rename a topic here (or with `--ros-args -p gps_topic:=...`), never in Rust.
# Built into the program as its defaults, so --demo shows the same names.
hud:
  ros__parameters:
    vehicle_status_topic: /vehicle/status                 # aav_interfaces/msg/VehicleStatus
    gps_topic: /sensors/gps/fix                           # sensor_msgs/msg/NavSatFix, the receiver itself
    gps_filtered_topic: /localization/gps/fix             # sensor_msgs/msg/NavSatFix, the EKF's position
    stop_sign_topic: /perception/stop_sign                # std_msgs/msg/Bool
    battery_topic: /vehicle/battery                       # sensor_msgs/msg/BatteryState
    camera_topic: /sensors/camera/front_left/image_raw    # sensor_msgs/msg/Image (rgb8, bgr8, mono8...)
    estop_topic: /safety/estop                            # std_msgs/msg/Bool: published, only ever true
    source_topic: /system/source                          # aav_interfaces/msg/DataSource, latched: the SIMULATED banner
    watchdog_topic: /safety/sensor_watchdog/state         # std_msgs/msg/String: the sensor watchdog's verdict, a banner unless OK
    output_mux_topic: /safety/output_mux/state            # std_msgs/msg/String: the output mux's gate, OPEN / WAIT / STOP: the GO / STOP panel
    heartbeat_topic: /hud/heartbeat                       # std_msgs/msg/UInt64: published, 10 Hz while the screen draws (frames drawn)
    stale_after: 1.0                                      # s: a topic this quiet shows STALE
    max_speed: 1.0                                        # m/s: ego's forward cap (aav_ego config/ego.yaml); the gauge's redline starts here. hud.launch.py copies ego.yaml's
    theme: initial_d                                      # the colours: initial_d (black, white, Carleton red; the arcade gauge), mocha (dark, night), latte (light, day)
