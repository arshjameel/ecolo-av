[package]
name = "panel-core"
description = "The hardware panel's logic, with no ROS and no raylib: the buttons, where they may drive, every sensor's number"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Shared with the HUD: OK / STALE / NEVER, /system/source, VehicleStatus, the GPS fix,
# the battery, the e-stop burst and the heartbeat.
hud-core = { path = "../hud-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
