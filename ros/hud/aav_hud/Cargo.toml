[workspace]
resolver = "2"
# hud-core: the HUD's state, formatting and e-stop logic. No ROS, no raylib:
#   `cargo test -p hud-core` runs anywhere.
# hud-app: the program itself, raylib on the main thread. The `ros` feature (on by
#   default, for colcon) adds the rclrs node; without it only --demo works:
#   `cargo run -p hud-app --no-default-features -- --demo`
# map-core: the map window's logic (map to screen, the grid's pixels, the distance left).
#   No ROS, no raylib: `cargo test -p map-core`.
# map-app: the map window for the big screen, binary `map`, built like hud-app:
#   `cargo run -p map-app --no-default-features -- --demo`
# debug-core: the debug HUD's logic (cubes, frames, poses at a stamp, the camera). No ROS, no
#   raylib: `cargo test -p debug-core`.
# debug-app: the debug HUD, binary `debug_hud`, built like hud-app:
#   `cargo run -p debug-app --no-default-features -- --demo`
# panel-core: the hardware panel's logic (the buttons, where they may drive, the sensors'
#   numbers, safety.py's rules). No ROS, no raylib: `cargo test -p panel-core`.
# panel-app: the hardware panel, binary `hw_panel`, built like hud-app:
#   `cargo run -p panel-app --no-default-features -- --demo`
members = [
  "crates/hud-core",
  "crates/hud-app",
  "crates/map-core",
  "crates/map-app",
  "crates/debug-core",
  "crates/debug-app",
  "crates/panel-core",
  "crates/panel-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
