# The node graph contract: every topic, service and action between our packages.
#
# docs/interfaces.md is generated from this file (tools/gen_interfaces_md.py), and
# tools/check_graph.py compares a running system against it. Change the graph here first.
#
# live: the bringup profiles where the topic must have a publisher
#   turtle = aav_bringup turtle.launch.py, sim = sim.launch.py, car = car.launch.py,
#   replay = replay.launch.py with a bag playing (the bag supplies the raw inputs),
#   bench = bench.launch.py: the car's graph, with stand-ins for the hardware,
#   road = sim.launch.py world:=road: Gazebo's road world, which adds the car's camera and
#   radar stand-in. Whatever is live in sim must be live there too (check_graph.py)
#   spine = sim.launch.py world:=road spine:=true: the road world with the spine in the
#   loop (spine_bridge, the CAN topics, spine_sim on Gazebo's car). Whatever is live in
#   sim and road must be live there too
# drop_in: what a stream must be, beyond name and type, so anything can replace what makes it:
#   Gazebo, our simulator, the real sensor (Ben, 5 Nov). The floors are Gazebo's rates
#   measured 5 Nov, less a margin; the ceilings are the car's (docs/bandwidth.md) plus a margin.
#   tools/drop_in_check.py measures them; pixi run drop-in.
# All topic names are absolute. QoS is the ROS default (reliable, volatile, depth 10)
# unless noted.
#
# Names (docs/naming.md, Decided 15 Oct): every topic starts with its area,
#   /<area>/<device or node>/<thing>
# areas: /sensors/ /vehicle/ /can/ /localization/ /perception/ /drivers/ /control/ /ego/
# /safety/ /hud/ /system/. Only ROS's own global names (/tf, /tf_static, /clock, /joint_states,
# /robot_description...) and Nav2's (/map, /goal_pose, /plan) stay outside an area.
# tools/tests/test_topic_areas.py checks every topic below.

topics:
  # --- drivers -> mux -> ego (the command path) ---
  /drivers/joy/joy:
    type: sensor_msgs/msg/Joy
    pub: [joy_node]
    sub: [joy_alive, joy_teleop]
    note: Joystick axes and buttons, 20 Hz while the USB receiver is in - joy_node repeats the last state (autorepeat_rate), so a pad turned off with its receiver still in may repeat a held trigger and stick (TODO 74a). joy_node, joy_alive, teleop_twist_joy_node and joy_teleop run in the namespace /drivers/joy (aav_teleop teleop.launch.py), so their relative topics land here. bench_check.py publishes it itself to play a live, frozen and silent pad (teleop.launch.py joy_device:=false).
  /drivers/joy/joy_checked:
    type: sensor_msgs/msg/Joy
    pub: [joy_alive]
    sub: [teleop_twist_joy_node]
    note: The joystick, only while it is really there and moving (aav_safety joy_alive, joy_alive.py) - each /drivers/joy/joy message as it came, or while stopped a released copy (every axis and button 0), so teleop_twist_joy sends one zero and nothing more; once more the moment silence trips it. It stops on SILENT (no Joy for 0.5 s - the receiver unplugged, joy_node dead) and FROZEN (the deadman held and the throttle axis off centre, every axis and button bit-identical for 2 s - a dead pad's receiver repeating itself; a stick pinned at its edge trips it too). Both latch until the deadman is seen released; at start-up nothing passes until it has been released once (WAITING). aav_teleop config/joy_alive.yaml.
  /drivers/joy/alive:
    type: std_msgs/msg/String
    pub: [joy_alive]
    sub: []
    note: One line for people, 10 Hz - OK, WAITING, SILENT or FROZEN, a dash, and why, such as "FROZEN - the same values for over 2 s while driving - a dead pad? Release the deadman to drive again". bench_check.py reads it (the frozen-pad check).
  /drivers/joy/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [teleop_twist_joy_node]
    sub: [twist_mux, language_drive, ego]
    note: Priority 100. Only while the deadman (trigger) is held.
  /drivers/keyboard/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [teleop_twist_keyboard]
    sub: [twist_mux, language_drive, ego]
    note: Priority 90 (twist_mux's keyboard slot). A person driving from a laptop - teleop_twist_keyboard in the namespace /drivers/keyboard (tools/keyboard.sh, stamped:=true), or the Foxglove teleop panel set to this topic - on the stand-ins only, as the car's bridge only watches (foxglove.launch.py).
  /drivers/rc/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [rc_driver]
    sub: [twist_mux, language_drive, ego]
    note: Priority 95 (proposed, TODO 48) - a person with the RC transmitter, below the joystick's deadman (100), above the keyboard (90). rc_driver (aav_rc) turns /vehicle/rc into a command only while the transmitter's mode switch is on RC via ROS - throttle stick x max_speed (1.0 m/s; reverse 0.5), steering stick x the steering limit, as a turn rate by the bicycle model - at the uplink's 50 Hz, zeros included, so nothing below it drives. It publishes one zero when the switch leaves RC via ROS; if /vehicle/rc goes quiet while on RC via ROS it keeps publishing zeros (a stop) until the uplink comes back. RC direct never comes here - the ESP32 drives from the sticks itself.
  /drivers/tests/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [actuator_test]
    sub: [twist_mux, language_drive]
    note: Priority 60, below both people (joystick 100, keyboard 90) and above every other program. Only while an actuator test runs (aav_actuator_tests, pixi run actuator-test; docs/tests.md stages 3-4), or the preflight on stands (pixi run actuator-test preflight --stands, that is actuator-test preflight, which also counts every sensor topic it subscribes to). It also reads /control/cmd_vel, to stop when someone else takes over.
  /drivers/buttons/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [hw_panel]
    sub: [twist_mux, language_drive]
    note: Priority 45 (twist_mux's buttons slot) - the hardware panel's simple buttons (aav_hud hw_panel, pixi run hw-panel; docs/hud.md; docs/designs/2026-10-29_two-screens.md, option A). Below people (90-100), the actuator tests (60) and a scripted run (50); above replay (40), the point driver (25), Nav2 (20) and AI (10). The geofence's lock (51) and the no-timeout lock (60) hold it; the stop-sign and sensor locks (30) don't, so it works on stands. Sent only while GO (Space, or the button) is held, then 0.5 s of zeros, at 10 Hz and only while the panel's window draws (hud-core's heartbeat), so a frozen window stops it; speed only on SIM and BENCH (at most 1.0 m/s), never the real car on the ground, and on stands only once a driven-wheel speed exists (TODO 49b). An e-stop, someone else driving (/control/cmd_vel not the panel's for 0.3 s) or a /system/source change zeroes it and needs GO pressed again. Steering is sent as a turn rate (v tan(delta) / L), so it moves only while creeping. Stamp 0 (twist_mux and ego go by arrival).
  /drivers/buttons/steering_calibration:
    type: aav_interfaces/msg/SteeringCalibration
    pub: [hw_panel]
    sub: [legacy_uart_bridge]
    note: A person on the hardware panel asks for the steering actuator's calibration mode, to find its ends and centre (docs/actuator-tests.md) - MODE_LIMP (its motor off, the wheels turned by hand) or MODE_JOG to target counts (moved slowly, at 300 counts a second, inside the software limits), MODE_OFF to stop. Sent at 10 Hz while the person holds the mode, and only while the panel's window draws; the bridge drops it after 0.5 s of silence. Only from the panel, never Nav2 or a program; not through twist_mux - it carries no motion. legacy_uart_bridge passes it on in its version 3 frames only with steering_calibration stands or bench (the hardware lead's say-so; none by default, and in legacy.yaml), frame_version 3, a fresh uplink, no e-stop, ego not asking for speed and the wheel speed under 0.05 m/s; meanwhile its frames stand the car still (no speed, brake full, not armed). The firmware then checks again (standing, braked, analog feedback, no e-stop or other driver) and holds the throttle at 0 (legacy-link's SteerCal). The panel's STEERING CAL page sends it (1 Nov) - GO LIMP, HOLD and STEP (jog, inside jog_min..jog_max, 400-3500), and its lock-to-lock check (jog inside the measured limits, stopped and held on resistance); END sends MODE_OFF for 0.5 s. ros2 topic pub works on the bench too.
  /drivers/scripted/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [scripted_driver]
    sub: [twist_mux, language_drive, ego]
    note: Priority 50. Only while a /scripted_drive goal runs. language_drive (aav_language, plain-English driving) only reads the mux inputs' arrival times, to tell who drives.
  /drivers/replay/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: []
    sub: [twist_mux, language_drive]
    note: Priority 40. ros2 bag play of a recorded /control/cmd_vel (tools/replay_commands.sh).
  /drivers/point/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [point_driver]
    sub: [twist_mux, language_drive, ego]
    note: Priority 25 - below every person, test and script, above Nav2. Only while a /drive_to_point goal runs (aav_drive_to_point, pixi run drive-to-point; docs/a-to-b.md). Drives on GPS, so the stop-sign and sensor locks (30) hold it. It also reads /control/cmd_vel, to stop when someone else takes over.
  /drivers/nav/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [velocity_smoother, collision_monitor]
    sub: [twist_mux, language_drive, ego]
    note: Priority 20. Nav2. From collision_monitor where the radar or the lidar runs (navigation.launch.py radar:=true or lidar:=true - the bench, the car with its radar part, Gazebo's road and test_lot worlds), else straight from velocity_smoother. With smoother:=own (sim only, docs/own-smoother.md) velocity_smoother is aav_smoother's car_smoother under Nav2's node name - the same parameters and topics, the turn rate from the steering's rate and full lock.
  /control/cmd_vel_smoothed:
    type: geometry_msgs/msg/TwistStamped
    pub: [velocity_smoother]
    sub: [collision_monitor]
    note: Nav2's smoothed command, into collision_monitor, where the radar or the lidar runs. It stops the car for radar or lidar points in its stop zone, or when either goes silent; it only guards Nav2.
  /safety/sensor_watchdog/lock:
    type: std_msgs/msg/Bool
    pub: [sensor_watchdog]
    sub: [twist_mux, point_driver, behaviour]
    live: [sim]
    note: true while a sensor Nav2 or the AI slot needs is stale, NaN, frozen, jumped, or (the wheels) disagrees with the IMU; false otherwise (aav_safety sensor_watchdog, 10 Hz) - a heartbeat. A twist_mux lock at priority 30, as the stop sign - it holds Nav2 and the AI slot, never a person or a test. Fail-safe - the lock's 1 s timeout holds them too when the watchdog dies or hangs (aav_command_mux mux.launch.py sensor_lock, true wherever a watchdog runs - Gazebo with watchdog:=true, the bench, and the car next to the mux; false on the turtle).
  /safety/legacy_uart_bridge/lock:
    type: std_msgs/msg/Bool
    pub: [legacy_uart_bridge]
    sub: [twist_mux, actuator_test, hw_panel]
    live: [car]
    note: Latched (reliable, transient local, depth 1), and sent again at 5 Hz, as twist_mux's lock subscription is volatile and would miss a latched message sent before it started. true while legacy_uart_bridge runs frame_version 1 - the 2025-26 C++ firmware, which has no command timeout, so a dead bridge or Orin leaves the last throttle on; false with frame_version 2 (the Rust firmware brakes 100 ms after the Orin's counter stops). A twist_mux lock (no_timeout) at priority 60 with timeout 0 - it holds every program below the actuator tests (scripted 50, replay 40, point 25, nav 20, ai 10), never a person (joy, rc, keyboard) or the actuator tests (60, run by a person who types a confirmation). Timeout 0, so where no legacy bridge runs (spine, sim, bench, turtle) it never locks. Once true it stays true in twist_mux until the bridge says false or twist_mux restarts. The bridge's allow_programs_without_timeout (default false, for a supervised stand only) makes it false.
  /safety/sensor_watchdog/state:
    type: std_msgs/msg/String
    pub: [sensor_watchdog]
    sub: [hud, map, dev_window]
    live: [sim]
    note: One line for people, 10 Hz - OK, or STOP (the lock is on) or WARN, then each input that isn't OK and why, those that stop first, such as "STOP - gps STALE (nothing for 2.3 s (more than 2 s))". The HUD and the map window show it as a banner, and the HUD the first input in its GO / STOP panel, red for STOP or when it goes silent (then twist_mux holds Nav2 too).
  /hud/heartbeat:
    type: std_msgs/msg/UInt64
    pub: [hud]
    sub: [sensor_watchdog]
    note: The HUD's screen is alive - the number of frames it has drawn, 10 Hz, sent only while that number rises, from the same 10 ms timer that sends the e-stop button's messages, so it stops when the screen or the e-stop's sender freezes or dies. The sensor watchdog's hud input (kind heartbeat, 1 s; car.launch.py watch_hud:=true, the default; sim.launch.py with hud:=true or watch_hud:=true) - silent, or a count that stops rising, locks twist_mux's sensors lock like a dead sensor - Nav2 and the AI slot stop, people and the e-stop never. Latched (Ben, 24 Oct) - a dropout after the HUD's start-up holds them as hud LOST, even once it beats again, until a person calls /safety/sensor_watchdog/clear; one dropout within 5 s of its first beat is forgiven. Reliable, depth 10.
  /hud/dev_window/heartbeat:
    type: std_msgs/msg/UInt64
    pub: [dev_window]
    sub: [output_mux]
    note: The developer window is alive - the number of frames it has drawn, 10 Hz, only with --developer. Read only with sim watch_screens - a test of what stops the car, refused for the real car
  /hud/hw_panel/heartbeat:
    type: std_msgs/msg/UInt64
    pub: [hw_panel]
    sub: [output_mux]
    note: The hardware panel is alive - the number of frames it has drawn, 10 Hz. Read only with sim watch_screens - a test of what stops the car, refused for the real car
  /safety/collision_monitor/state:
    type: nav2_msgs/msg/CollisionMonitorState
    pub: [collision_monitor]
    sub: [stop_hold]
    note: What collision_monitor does, on each change - action_type 0 nothing, 1 stop; polygon_name StopZone, or "invalid source" when the radar or the lidar is silent or its TF is late. It decides afresh on every command, so it can flicker between the two at the stop zone's edge - stop_hold holds the stop.
  /safety/stop_zone/shadow/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [stop_zone]
    sub: []
    live: []
    note: Our stop zone in Rust (aav_stop_zone, stop_zone_shadow:=true), in shadow - the command collision_monitor's twin would send, zero where it would stop. Nothing reads it; measures compare it with collision_monitor's (TODO 182).
  /safety/stop_zone/shadow/state:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [stop_zone]
    sub: []
    live: []
    note: Each command - OK (clear) or WARN and why it would stop (points in the forward or backward box, or a silent sensor).
  /safety/stop_hold/lock:
    type: std_msgs/msg/Bool
    pub: [stop_hold]
    sub: [twist_mux, language_drive, behaviour]
    live: [bench, road]
    note: true from collision_monitor's STOP until it has said anything else for 1 s without a break (aav_safety stop_hold, 10 Hz, wherever navigation.launch.py starts collision_monitor). A twist_mux lock at priority 21 - it holds Nav2 (20) and the AI slot (10) only, never the point driver, a person or a test. Timeout 0 - silence locks nothing (profiles without collision_monitor never publish it), and a stop_hold that dies while true keeps the stop. Without it, an obstacle at the stop zone's edge flickered the monitor between stop and go, and each go let the car creep on.
  /safety/geofence/lock:
    type: std_msgs/msg/Bool
    pub: [geofence]
    sub: [twist_mux, language_drive, hw_panel, behaviour]
    live: [sim, car, bench]
    note: true while a stopping path of the car - forward and back, straight and at full lock, each its RSS stopping distance long (reaction time and braking worked out from ego.yaml, vehicle.yaml and the backend's timeout, aav_safety geofence.py motion_from) - brings a corner within 1 m plus the global pose's spread of the fence's edge (NEAR; at a standstill a person drives it back in); while the car is outside the fence (OUTSIDE) or the global pose jumped (JUMP), both latched until a person calls /safety/geofence/clear; while the global pose is stale over 1 s, over 3 m unsure or NaN, or no GPS position has reached the EKF for 2 s (LOST); before 3 s of good poses (STARTING); and on a backend that coasts (COASTING - legacy_uart_bridge, in either speed_loop mode, until test 4.3 measures that mode's stop). false otherwise, and in stands mode (STANDS - car.launch.py stands:=true, said loudly); a heartbeat at 10 Hz (aav_safety geofence). The fence - a circle of radius m round the marked start spot (start_x, start_y - car 30, Gazebo 200, bench 100), or a site's polygon in the map frame drawn for navsat.yaml's datum (geofence.yaml sites; the machine file's geofence site). A twist_mux lock (geofence) at priority 51 - it holds every program (scripted 50, replay 40, point 25, nav 20, ai 10), never a person (joy, rc, keyboard) or the actuator tests (60, which stop themselves on its state). Fail-safe - the lock's 1 s timeout holds them when the geofence dies or hangs (mux.launch.py geofence_lock, a required argument - true wherever a geofence runs, the car next to the mux, the bench, Gazebo with geofence:=true; false on the turtle and CARLA). Independent of Nav2 (the 26 Oct review's F6). docs/geofence.md.
  /safety/geofence/state:
    type: std_msgs/msg/String
    pub: [geofence]
    sub: [actuator_test, behaviour]
    live: [sim, car, bench]
    note: One line for people, 10 Hz - the state (STARTING, OK, NEAR, OUTSIDE, JUMP, LOST, COASTING, STANDS), a colon, and why, such as "NEAR - a stopping path (1.4 m ahead, 0.9 m back) comes 0.9 m from the edge (needs 1.2 m) at 1.0 m/s". The actuator tests (aav_actuator_tests) stop a test on the ground on NEAR, OUTSIDE, JUMP or LOST, refuse one in STANDS, and on the real car refuse to start while it is silent.
  /safety/geofence/fence:
    type: geometry_msgs/msg/PolygonStamped
    pub: [geofence]
    sub: [point_driver, language_drive, behaviour]
    live: [sim, car, bench]
    note: The fence in the map frame (a circle as 36 corners), for RViz and Lichtblick, and so the point driver and the drive server refuse a goal outside it before the car moves. Reliable, transient local, depth 1 - sent once, at start-up.
  /safety/collision_monitor/stop_zone:
    type: geometry_msgs/msg/PolygonStamped
    pub: [collision_monitor]
    sub: []
    note: The stop zone in base_link, for RViz - from the front bumper to 1 m ahead, 0.2 m wider than the body each side (vehicle.yaml, through aav_description vehicle.py).
  /safety/ghost/scan:
    type: sensor_msgs/msg/LaserScan
    pub: [ghost_obstacle]
    sub: [local_costmap, collision_monitor]
    note: A pretend person for stopping tests with nothing real to hit (aav_ghost ghost_obstacle, navigation.launch.py ghost:=true - sim.launch.py and car.launch.py pass it; off by default). In base_link, 720 ranges all the way round, 10 Hz - the ghost's near side, inf everywhere else, all inf with no ghost. Read by the local costmap's own ghost_layer and as collision_monitor's ghost source, so it only ever adds an obstacle, never clears or hides a real one. Silent for 1 s, it stops Nav2 like a silent radar. Placed with pixi run ghost (ahead 10, at x y, off). docs/ghost-obstacles.md.
  /safety/ghost/marker:
    type: visualization_msgs/msg/Marker
    pub: [ghost_obstacle]
    sub: []
    note: The ghost as a purple cylinder in the map frame, for RViz and Lichtblick; DELETE when it goes.
  /safety/collision_monitor/collision_points_marker:
    type: visualization_msgs/msg/MarkerArray
    pub: [collision_monitor]
    sub: []
    note: The radar and lidar points collision_monitor sees, for RViz; sent only while someone listens.
  /drivers/scripted/lag_aware:
    type: std_msgs/msg/Bool
    pub: []
    sub: [ego]
    note: Latched (reliable, transient local, depth 1). true - this driver leads for the car's lag and dead times itself (a lag-aware tracker, such as aav_track's MPC or the Rust MPPI), so ego's own lead (lag_lead) turns off while its commands drive; false or never sent - ego may lead (docs/vehicle-model.md). Publish true when the lag-aware mode starts and false when it ends, once each (latched), and stamp every cmd_vel with now - ego knows whose command it obeys by matching /control/cmd_vel (twist_mux passes the winner's message on unchanged) against each lag-aware driver's last commands (stamp and twist), so a message re-stamped on the way can't match. ego watches the drivers in its lag_aware_drivers parameter (ego.yaml - scripted, point, nav, ai). No publisher yet.
  /drivers/point/lag_aware:
    type: std_msgs/msg/Bool
    pub: []
    sub: [ego]
    note: Latched (reliable, transient local, depth 1). true - this driver leads for the car's lag and dead times itself (a lag-aware tracker, such as aav_track's MPC or the Rust MPPI), so ego's own lead (lag_lead) turns off while its commands drive; false or never sent - ego may lead (docs/vehicle-model.md). Publish true when the lag-aware mode starts and false when it ends, once each (latched), and stamp every cmd_vel with now - ego knows whose command it obeys by matching /control/cmd_vel (twist_mux passes the winner's message on unchanged) against each lag-aware driver's last commands (stamp and twist), so a message re-stamped on the way can't match. ego watches the drivers in its lag_aware_drivers parameter (ego.yaml - scripted, point, nav, ai). No publisher yet.
  /drivers/nav/lag_aware:
    type: std_msgs/msg/Bool
    pub: [mppi_lag, track]
    sub: [ego]
    note: Latched (reliable, transient local, depth 1). true - this driver leads for the car's lag and dead times itself (a lag-aware tracker, such as aav_track's MPC or the Rust MPPI), so ego's own lead (lag_lead) turns off while its commands drive; false or never sent - ego may lead (docs/vehicle-model.md). Publish true when the lag-aware mode starts and false when it ends, once each (latched), and stamp every cmd_vel with now - ego knows whose command it obeys by matching /control/cmd_vel (twist_mux passes the winner's message on unchanged) against each lag-aware driver's last commands (stamp and twist), so a message re-stamped on the way can't match. ego watches the drivers in its lag_aware_drivers parameter (ego.yaml - scripted, point, nav, ai). Publishers (both drive through Nav2, so this slot) - aav_track's track node - true while its tracker models the lags itself (tracker:=mpc_lag, docs/trials.md), false for every other tracker, sent at start, on each live swap, and false as it stops; aav_mppi_lag's mppi_lag (tracker:=mppi_lag) - false at start, true when it starts following a path with model lag, false when the path ends and when it exits, always false with model ideal. Absent with Nav2's own controllers (no lag in their model). Nav2 republishes their command (velocity_smoother, collision_monitor) with its own stamps; ego matches what reaches /drivers/nav/cmd_vel, so the whole Nav2 slot counts as lag-aware while this is true.
  /drivers/ai/lag_aware:
    type: std_msgs/msg/Bool
    pub: []
    sub: [ego]
    note: Latched (reliable, transient local, depth 1). true - this driver leads for the car's lag and dead times itself (a lag-aware tracker, such as aav_track's MPC or the Rust MPPI), so ego's own lead (lag_lead) turns off while its commands drive; false or never sent - ego may lead (docs/vehicle-model.md). Publish true when the lag-aware mode starts and false when it ends, once each (latched), and stamp every cmd_vel with now - ego knows whose command it obeys by matching /control/cmd_vel (twist_mux passes the winner's message on unchanged) against each lag-aware driver's last commands (stamp and twist), so a message re-stamped on the way can't match. ego watches the drivers in its lag_aware_drivers parameter (ego.yaml - scripted, point, nav, ai). No publisher yet.
  /drivers/ai/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [control_interface]
    sub: [twist_mux, language_drive, ego]
    note: Priority 10, the slot for a learned driver. Today the 2025-26 lane keeping (aav_lane_geometry) uses it.
  /safety/estop:
    type: std_msgs/msg/Bool
    pub: [joy_teleop, hud, language_drive, actuator_test, hw_panel, dev_window]
    sub: [twist_mux, spine_bridge, legacy_uart_bridge, language_drive, actuator_test, carla_adapter, point_driver, hw_panel, behaviour, ego]
    note: true = stop. ego turns the pedal off (full braking) while true. Lock on twist_mux (priority 255) and the backends brake at once. Cleared only by publishing false, from a laptop. The HUD's e-stop button (hud, aav_hud) only ever publishes true (five times in 0.5 s), reliable like the backends' subscriptions; language_drive (aav_language) does the same from its estop() tool, and the hardware panel (hw_panel) from its E-STOP button; actuator_test's preflight sets it when the car is still moving 5 s after its stop. None of them ever publishes false.
  /control/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [twist_mux]
    sub: [ego, actuator_test, point_driver, hw_panel]
    live: [turtle, sim, car, bench]
    note: The one command ego obeys. v (m/s) and w (rad/s) in base_link.
  /ego/trace:
    type: nav_msgs/msg/Path
    pub: [ego]
    sub: [look_ahead, hud, dev_window]
    live: [turtle, sim, car, bench]
    note: "Where the car is going, like a tail but in front (Ben, 7 Nov) - ego's prediction over trace_horizon (2 s), 10 Hz (trace_rate_hz), a pose every 0.1 s from now (21 poses), frame base_link at the header's stamp (each pose stamped with its own time ahead). From the shared car model (aav_description car_model.py - the speed loop, dead times, lags, steering motor and bicycle), started from ego's twin of the car (its actuators as ego drove them, its speed the last /vehicle/odom), driven by a copy of ego with the request held (its lead, ramps and limits). base_link, not odom - ego needs no localization (stands, the turtle), and a driver turns it into odom with TF at the stamp. Every number is a guess until car tests 3.10-3.12 and 4.1-4.5. For drivers to match against their plan, and for screens - the squiggly line's bold line (docs/hud.md). aav_ego trace_ahead.py."
  /ego/stop_point:
    type: geometry_msgs/msg/PoseStamped
    pub: [ego]
    sub: [look_ahead, hud, dev_window]
    live: [turtle, sim, car, bench]
    note: "Where the car stops if it brakes fully now (Ben, 7 Nov) - the one answer every screen and the stop-point check read. ego, with each /ego/trace (10 Hz), from the same twin and shared car model (aav_ego stop_ahead.py) - the throttle let go, the brake full (its dead time and lag), the wheels held where they point, stepped until the speed is 0. Frame base_link, stamped as the trace (now), so TF at the stamp puts it in odom or map; (0, 0) when parked. Its distance is docs/designs/2026-11-05_how-the-car-stops.md's S(v) - v x the brake's delay + v^2 / 2 max_brake, a little less for the drag. Every number is a guess until car test 4.3."
  /ego/plan_ahead:
    type: nav_msgs/msg/Path
    pub: [look_ahead]
    sub: [hud, dev_window]
    live: [turtle, sim, car, bench]
    note: "The squiggly line's faint line - what the planner WANTS, in base_link, so a screen needs no TF (aav_ego look_ahead, 10 Hz while /ego/trace is fresh). /drivers/nav/local_plan while fresh (0.5 s), else Nav2's /plan, moved into base_link with the newest TF and cut from beside the car to plan_ahead_m (10 m) on. No poses - no plan (a person drives); it is still sent, so a screen clears its old line. Header as the trace's."
  /ego/ahead:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [look_ahead]
    sub: [hud, dev_window]
    live: [turtle, sim, car, bench]
    note: "The squiggly line's numbers, worked out once for every screen (aav_ego look_ahead look_ahead.py, 10 Hz with /ego/plan_ahead). name look_ahead; level OK (green - the trace keeps within gap_warn, 0.3 m, of the plan, or there is no plan), WARN (amber - within gap_bad, 0.6 m), ERROR (red - further); message one line for people, such as 'ON PLAN 0.12 m - stops in 1.4 m, 0.8 m short of the goal, 3.0 m before an obstacle'. values gap_m (the most a trace pose strays from the faint line), plan (local, global, none), stop_m (/ego/stop_point's distance), goal_m (from the stop point to /plan's end, along it - + short, - past), obstacle_m (how far base_link goes along the trace, then straight on to look_m, 15 m, before the front bumper meets a lethal cell of /local_costmap/costmap), room_m (obstacle_m - stop_m - below 0 a full brake now still hits it); 'nan' - unknown; front_m, rear_m, half_width_m - the body outline from base_link (vehicle.yaml), so a screen draws the car and where its front bumper stops without copying a measurement; road_mps, road_m, road_why - what /world/road_ahead allows where the car is (the writer's limit), the metres to its end, and its nearest stop's reason (sign, obstacle, fence, goal; empty for none), 'nan' and empty with no fresh road ahead. No stop lines yet - no topic gives where one is."
  /ego/actuator_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    pub: [ego]
    sub: [output_mux, hw_panel]
    live: [turtle, sim, car, bench]
    note: 50 Hz, always. speed (m/s), steering_angle (rad, + left), acceleration, steering_angle_velocity. No backend reads it - the output mux passes it on to the one target's /control/<target>/actuator_cmd (aav_io_mux, docs/sources-and-targets.md). The hardware panel's GRAPHS page reads it only to judge the first hop (ego), and pairs it with the mux's output by stamp.

  # --- the output mux -> one backend (aav_io_mux output_mux, target:=) ---
  /control/car/actuator_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    pub: [output_mux]
    sub: [spine_bridge, legacy_uart_bridge, hw_panel]
    live: [car]
    note: The real car's commands - ego's /ego/actuator_cmd, passed on unchanged by output_mux target:=car, and only while the sensor mux says every source is REAL and nothing on /system/source says otherwise. Anything else and it sends nothing - latched until /safety/output_mux/clear on evidence (an announcement of another source, the sensor mux's problems), only held shut on doubt (the sensor mux not heard or quiet for 3 s, or its doubts); the backends' own timeouts brake (spine_bridge 0.1 s then the spine's 100 ms, legacy_uart_bridge 0.3 s). The real backends read only this topic (spine_bridge with source real), so a simulator's ego can't reach them. The hardware panel's GRAPHS page only reads it (the mux hop - equal to ego's, paired by stamp).
  /control/car/link_frame:
    type: aav_interfaces/msg/LinkFrame
    pub: [legacy_uart_bridge]
    sub: [hw_panel]
    note: What the Pi really wrote to the ESP32 - a sample of the serial frames (link_frame_rate_hz, default 10), with the frame's own values and a count of every frame written. tools/link_check.py compares the counts with the ESP32's. Named by role, as the bridge is interim.
  /control/car/heartbeat:
    type: aav_interfaces/msg/Heartbeat
    pub: [output_mux]
    sub: [legacy_uart_bridge]
    live: [car]
    note: The Orin's heartbeat (TODO 50) - one message for each command output_mux target:=car passes on to /control/car/actuator_cmd, so only while its gate is OPEN; counter +1 each time (u8, 255 then 0), header copied from the command. legacy_uart_bridge (the Motor Pi) copies the last counter into every version 2 serial frame and never makes one up, so a stuck or cut-off Pi can't fake it. The Rust ESP32 firmware brakes, latched, when the counter hasn't changed for 100 ms (docs/rust-firmware.md, "The heartbeat"). spine_bridge doesn't read it - DRIVE_CMD has its own counter.
  /control/sim/actuator_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    pub: [output_mux]
    sub: [gazebo_adapter, spine_bridge, legacy_uart_bridge]
    live: [sim]
    note: Gazebo's commands, from output_mux target:=sim, while every source is SIM. Exactly one backend reads it - gazebo_adapter, or in the spine profile (spine:=true) spine_bridge with source sim, or with today's car in the loop (esp32:=true) legacy_uart_bridge, remapped from /control/car/actuator_cmd, with source sim.
  /control/sim/heartbeat:
    type: aav_interfaces/msg/Heartbeat
    pub: [output_mux]
    sub: []
    live: [sim]
    note: The output mux's heartbeat for Gazebo, as /control/car/heartbeat - one for each command passed on. Nothing reads it here; only the real car's Motor Pi relays it.
  /control/bench/actuator_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    pub: [output_mux]
    sub: [spine_bridge]
    live: [bench]
    note: The bench's commands, from output_mux target:=bench, while every source is BENCH - into spine_bridge with source bench, then spine_sim.
  /control/bench/heartbeat:
    type: aav_interfaces/msg/Heartbeat
    pub: [output_mux]
    sub: []
    live: [bench]
    note: The output mux's heartbeat for the bench, as /control/car/heartbeat - one for each command passed on. Nothing reads it here; only the real car's Motor Pi relays it.
  /control/turtle/actuator_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    pub: [output_mux]
    sub: [turtlesim_adapter]
    live: [turtle]
    note: The turtle's commands, from output_mux target:=turtle, while every source is SIM.
  /control/turtle/heartbeat:
    type: aav_interfaces/msg/Heartbeat
    pub: [output_mux]
    sub: []
    live: [turtle]
    note: The output mux's heartbeat for the turtle, as /control/car/heartbeat - one for each command passed on. Nothing reads it here; only the real car's Motor Pi relays it.
  /control/carla/actuator_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    pub: [output_mux]
    sub: [carla_adapter]
    note: CARLA's commands, from output_mux target:=carla, while every source is SIM (carla.launch.py; untested, needs the NVIDIA computer).
  /control/carla/heartbeat:
    type: aav_interfaces/msg/Heartbeat
    pub: [output_mux]
    sub: []
    note: The output mux's heartbeat for CARLA, as /control/car/heartbeat - one for each command passed on. Nothing reads it here; only the real car's Motor Pi relays it.
  /safety/output_mux/state:
    type: std_msgs/msg/String
    pub: [output_mux]
    sub: [hud, spine_bridge, dev_window]
    live: [turtle, sim, car, bench]
    note: One line for people, 2 Hz and on each change - OPEN (passing ego's commands on), WAIT (closed, not latched - the sensor mux not heard yet or quiet for 3 s, its doubts, a node on /system/source whose announcement hasn't arrived yet, or settling for 2 s after all clear) or STOP (latched, and why, such as "STOP - target car needs REAL - camera_front_left is SIM (gazebo_adapter)"). The target first, such as "OPEN - car". spine_bridge (role spine) reads it as the safety gate - /spine/arm is refused unless it said OPEN for the bridge's own target within gate_timeout (1.5 s); Ben, 24 Oct. The HUD's GO / STOP panel shows it, with the first reason.

  # --- the system: what kind of run this is ---
  /system/source:
    type: aav_interfaces/msg/DataSource
    pub: [gazebo_adapter, turtlesim_adapter, spine_bridge, legacy_uart_bridge, mock_imu, mock_gps, mock_battery, mock_camera, mock_radar, mock_lidar, replay_source, carla_adapter, camera_stream_front_left, camera_stream_front_right]
    sub: [hud, map, actuator_test, point_driver, point_cli, sensor_mux, output_mux, debug_hud, hw_panel, dev_window]
    live: [turtle, sim, car, replay, bench]
    note: Latched (reliable, transient local, depth 1). Where the data comes from - REAL, SIM, BENCH or REPLAY - per sensor, one list per announcer. Gazebo and turtlesim announce SIM; spine_bridge REAL on the car, BENCH on the bench and SIM in Gazebo's spine profile (its source parameter; gazebo_adapter then announces only the sensors), with each bench stand-in - with role:=sensors (today's wiring, the Orin's CAN bus with only the wheel sensors) only odometry and wheels, never an actuator; legacy_uart_bridge REAL; replay.launch.py REPLAY; each camera_stream_<camera> its camera (camera_front_left...) as its source parameter says, REAL on the car. The HUD shows a banner when anything isn't REAL. The sensor mux and the output mux count an announcement only while its announcer still publishes here, and refuse a run where any announcement differs from the source the run asked for.
  /system/algorithms:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [run_info]
    sub: []
    live: [sim]
    note: Which algorithms this run uses, as the launch chose them (aav_run_info run_info; sim.launch.py always, car.launch.py where Nav2 runs). Latched (reliable, transient local, depth 1), again every 2 s. name algorithms, level OK, message one short line (lattice, mppi, voxels, NDT scored...), hardware_id the run (sim world:=road, car); values one row each - run, planner, path follower (MPPI or RPP, or a trial tracker), obstacles (lidar scan or voxels, radar), local EKF and global EKF (their inputs), NDT, KISS-ICP, AMCL (off, scored only, or into an EKF). What the launch asked for, not what is alive - a live tracker swap shows on /drivers/nav/track/status. The cockpit layout's Algorithms table shows it.
  /system/sensor_mux/state:
    type: aav_interfaces/msg/SourceCheck
    pub: [sensor_mux]
    sub: [output_mux]
    live: [turtle, sim, car, replay, bench]
    note: The sensor mux's verdict, 2 Hz (aav_io_mux sensor_mux, source:=real, sim, bench or replay) - ok when each sensor topic it watches (provenance.SENSORS - the IMU, GPS, cameras, radar, lidar, wheels, odometry, battery) has at most one publisher, that publisher's source as /system/source says (an unannounced one counts as REAL - the car's stock drivers can't announce), and every announcement equals source. An announcement of another source is a problem at once; a graph finding (two publishers, an unannounced one in a simulator) is a doubt until it has lasted 5 s (provenance.Hold), as a node can be seen before its announcement or its name arrive. Silent for its first 2 s, while discovery settles. It relays no data - it checks where the data comes from - so the heavy topics (pictures, point clouds) cost nothing extra.

  # --- backends -> the rest ---
  /vehicle/odom:
    type: nav_msgs/msg/Odometry
    drop_in: {min_hz: 45, frame: odom}
    pub: [spine_bridge, encoder_udp, turtlesim_adapter, gazebo_adapter, carla_adapter]
    sub: [ekf_local, ekf_global, actuator_test, sensor_watchdog, gps_heading, legacy_uart_bridge, debug_hud, localization_health, ego]
    live: [turtle, sim, car, replay, bench]
    note: Twist only (vx, vy = 0, vyaw) in base_link, with covariances; pose covariance 1e3 (not measured). On the car, vx comes from the front wheel nodes when fresh, else from the spine's VEHICLE_FEEDBACK. With today's wiring (car.launch.py actuators:=uart, spine_bridge role:=sensors on the Orin) only from the two wheels while both are fresh, with no yaw rate (covariance 1e3 - the steering angle isn't on the bus). In Gazebo's spine profile spine_bridge publishes it from spine_sim's frames, as on the car; /vehicle/status, steering, throttle, brake and wheels likewise. legacy_uart_bridge reads it only with speed_loop.mode pi, to close its speed loop on vx.
  /vehicle/status:
    type: aav_interfaces/msg/VehicleStatus
    drop_in: {min_hz: 10}
    pub: [spine_bridge, gazebo_adapter, turtlesim_adapter, carla_adapter, legacy_uart_bridge]
    sub: [hud, language_drive, debug_hud, hw_panel, dev_window]
    live: [turtle, sim, bench]
    note: Mode, armed, e-stop, measured speed and steering, actuator levels, fault bits. For the HUD and Foxglove. legacy_uart_bridge publishes it, 10 Hz, only with uplink true (the ESP32's uplink frame on TX1, TODO 50 - off until its wire is confirmed) - speed NaN (that ESP32 has no wheel speed), steering_angle the steering Jrk's position or NaN; mode COMPUTER also while the transmitter's switch is on RC via ROS (/vehicle/rc has the switch).
  /vehicle/steering:
    type: aav_interfaces/msg/ActuatorState
    pub: [spine_bridge, gazebo_adapter, turtlesim_adapter, carla_adapter, legacy_uart_bridge]
    sub: [actuator_test, hw_panel]
    live: [turtle, sim, bench]
    note: The steering, the virtual centre wheel (rad, + left) - command (from /ego/actuator_cmd) and measured. In Gazebo, measured is the actuator model's angle (its speed, lag, offset and deadband). For plots and the actuator tests; /vehicle/status keeps it too. legacy_uart_bridge (uplink true, 50 Hz) - command ego's steering_angle while fresh (else NaN), measured the steering Jrk's scaled feedback in rad (NaN when the Jrk has no feedback set up).
  /vehicle/steering_actuator/raw:
    type: aav_interfaces/msg/ActuatorRaw
    pub: [legacy_uart_bridge]
    sub: [hw_panel]
    note: The steering actuator's position, raw - its Jrk's scaled feedback in counts (0..4095, the same units as its targets), not converted with the firmware's calibration, so it can measure that calibration (docs/actuator-tests.md, "Find the steering actuator's ends and centre"). valid false when the Jrk's feedback isn't analog or the read failed. calibration is the firmware's steering calibration state (OFF, LIMP, JOG, HOLD, RETURN, or REFUSED and why). legacy_uart_bridge, 50 Hz, only with uplink true; the counts come in the firmware's version 3 uplink (1 Nov) - an older firmware's version 2 uplink has none, so valid is false. The hardware panel's STEERING CAL page reads it - the live position, the marks, and the lock-to-lock check's following.
  /vehicle/brake_actuator/raw:
    type: aav_interfaces/msg/ActuatorRaw
    pub: [legacy_uart_bridge]
    sub: []
    note: The brake actuator's position, raw - as /vehicle/steering_actuator/raw (counts, 0..4095, not converted); calibration is always OFF. legacy_uart_bridge, 50 Hz, with uplink true (valid false with a version 2 uplink).
  /vehicle/steering_actuator/calibration:
    type: std_msgs/msg/String
    pub: [legacy_uart_bridge]
    sub: [hw_panel]
    note: One line for people, on each change and at 2 Hz while anyone asks - what the steering calibration does and why, such as "LIMP - the steering actuator's motor is off" or "REFUSED - steering_calibration is none - stands or bench only, set by the hardware lead". The bridge's own refusals come first (its steering_calibration parameter, frame_version 3, a fresh uplink, no e-stop, ego not driving, the car not moving); then the firmware's state from the uplink. Only with uplink true.
  /vehicle/esp32/uplink_health:
    type: aav_interfaces/msg/UplinkHealth
    pub: [legacy_uart_bridge]
    sub: [hw_panel]
    note: How the ESP32's uplink frames arrive - fresh, frames, lost and bad, 1 Hz, only with uplink true.
  /vehicle/throttle:
    type: aav_interfaces/msg/ActuatorState
    pub: [spine_bridge, gazebo_adapter, carla_adapter, legacy_uart_bridge]
    sub: [actuator_test, hw_panel]
    live: [sim, bench]
    note: The throttle, 0..1. From the spine (car, bench) only measured; command is NaN, as the spine's speed loop decides it. In Gazebo, command is the speed loop's, measured the actuator model's. From legacy_uart_bridge (uplink true) command is the value the firmware asks for before its ramp, and measured is NaN - no sensor reads the throttle.
  /vehicle/brake:
    type: aav_interfaces/msg/ActuatorState
    pub: [spine_bridge, gazebo_adapter, carla_adapter, legacy_uart_bridge]
    sub: [actuator_test, hw_panel]
    live: [sim, bench]
    note: The brake, 0..1. As /vehicle/throttle. legacy_uart_bridge (uplink true, 50 Hz) - command what the ESP32 drives the brake Jrk with, measured the brake Jrk's position (NaN when unknown).
  /vehicle/rc:
    type: aav_interfaces/msg/RcSticks
    pub: [legacy_uart_bridge]
    sub: [rc_driver]
    note: The RC transmitter as the car's ESP32 reads it (TODO 48), from its uplink frame, 50 Hz, only with uplink true - the mode switch (none, computer, RC via ROS, RC direct; the proposed three positions of CH6), the throttle stick signed by the gear switch, the steering stick (both -1..1, + forward, + left), the gear switch on brake. The channels and their calibration stay in the firmware (ibus RcMap).
  /vehicle/wheels:
    type: aav_interfaces/msg/WheelSpeeds
    pub: [gazebo_adapter, spine_bridge, carla_adapter]
    sub: [actuator_test, debug_hud, hw_panel, localization_health]
    live: [sim, bench]
    note: Each wheel's ground speed (m/s, signed), NaN where not measured or stale. Gazebo gives all four (its wheel joints). spine_bridge gives the front two, from the CAN wheel nodes (0x200, 0x201) at about 100 Hz; their mean, when fresh, is the speed in /vehicle/odom. With today's wiring the front two come from the wheel sensors' Arduino on the Orin's CAN bus (spine_bridge role:=sensors). The 2025-26 car's UDP encoder (aav_legacy encoder_udp, off since 23 Oct) is read only as /vehicle/odom.
  /vehicle/joint_states:
    type: sensor_msgs/msg/JointState
    pub: [spine_bridge]
    sub: [joint_state_publisher]
    live: [bench, spine]
    note: Measured front steering joint angles, merged into /joint_states.
  /joint_states:
    type: sensor_msgs/msg/JointState
    pub: [joint_state_publisher, gz_bridge, simulator]
    sub: [robot_state_publisher]
    live: [turtle, sim, car, replay, bench]
  /can/tx:
    type: can_msgs/msg/Frame
    pub: [spine_bridge]
    sub: [socket_can_sender, spine_sim]
    live: [bench, spine]
    note: DRIVE_CMD 0x100 at 50 Hz, ESTOP_CMD 0x010 at 10 Hz (firmware/can/aav.dbc). Only spine_bridge role:=spine (the CAN spine, car.launch.py actuators:=can) publishes it; with role:=sensors (today's wiring) nobody does, and no socket_can_sender starts.
  /can/rx:
    type: can_msgs/msg/Frame
    pub: [socket_can_receiver, spine_sim]
    sub: [spine_bridge]
    live: [bench, spine]
    note: VEHICLE_FEEDBACK 0x180 at 50 Hz, VEHICLE_STATUS 0x181 at 10 Hz, WHEEL_SPEED_L 0x200 and WHEEL_SPEED_R 0x201 at 100 Hz. On the bench and in Gazebo's spine profile, spine_sim sends them all. With today's wiring the bus has only the wheel sensors (an Arduino) and others not yet known; spine_bridge role:=sensors reads only 0x200 and 0x201.

  # --- sensors ---
  /sensors/imu/data_raw:
    type: sensor_msgs/msg/Imu
    pub: [imu_node, gazebo_imu, mock_imu, carla_adapter]
    sub: [imu_filter_madgwick, actuator_test]
    live: [sim, car, replay, bench]
    note: Gyro and accelerometer in imu_link, with covariances; no orientation. In Gazebo, gazebo_imu adds the car's own acceleration, worked out from Gazebo's odometry.
  /sensors/imu/mag:
    type: sensor_msgs/msg/MagneticField
    pub: [imu_node, mock_imu]
    sub: [imu_filter_madgwick]
    live: [bench]
    note: Raw counts from imu_node (not tesla yet); tesla from mock_imu. The filter ignores it (use_mag false).
  /sensors/imu/data:
    type: sensor_msgs/msg/Imu
    drop_in: {min_hz: 45, max_hz: 220, frame: imu_link}
    pub: [imu_filter_madgwick]
    sub: [ekf_local, ekf_global, sensor_watchdog, navsat_transform, debug_hud, actuator_test, hw_panel, localization_health]
    live: [sim, car, replay, bench]
    note: Adds a relative orientation (no magnetometer). The EKFs fuse the yaw rate only.
  /sensors/gps/fix:
    type: sensor_msgs/msg/NavSatFix
    drop_in: {min_hz: 4.5, max_hz: 12, frame: gps_link}
    pub: [ublox_gps, gps_nmea, ublox_nav_sat_fix_hp, gazebo_gps, mock_gps, carla_adapter]
    sub: [navsat_transform, hud, language_drive, actuator_test, sensor_watchdog, point_driver, debug_hud, hw_panel, localization_health]
    live: [sim, car, replay, bench]
    note: Lat/lon of the antenna (gps_link). On the car, from the driver gps_driver:= picks - ublox_gps (ublox, the default; Tentative, Q18), gps_nmea (nmea) or ublox_nav_sat_fix_hp (ublox_dgnss). ublox_gps publishes it reliable (depth 1), ublox_dgnss best-effort (SensorDataQoS), so subscribe best effort.
  /sensors/gps/fix_velocity:
    type: geometry_msgs/msg/TwistWithCovarianceStamped
    pub: [ublox_gps, gazebo_gps]
    sub: [gps_heading, actuator_test]
    live: [sim]
    note: The receiver's velocity, east, north and up (m/s), from the satellites' Doppler (good to about 0.05 m/s), with its variance. gps_heading turns it into a heading. In Gazebo, gazebo_gps works it out from the car's true motion with that noise on top (the bridge drops the NavSat sensor's own). ublox_gps only - gps_driver:=nmea sends /sensors/gps/vel instead, which nothing reads.
  /sensors/gps/vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [gps_nmea]
    sub: []
    note: NMEA's speed and course (gps_driver:=nmea). Nothing fuses it yet.
  /sensors/gps/time_reference:
    type: sensor_msgs/msg/TimeReference
    pub: [gps_nmea]
    sub: []
    note: GPS time, from NMEA (gps_driver:=nmea).
  /sensors/radar/points:
    type: sensor_msgs/msg/PointCloud2
    drop_in: {min_hz: 9, frame: radar_link}
    pub: [radar, mock_radar, gazebo_radar, carla_adapter]
    sub: [radar_clusters, local_costmap, collision_monitor, sensor_watchdog, actuator_test, hw_panel]
    live: [bench, road]
    note: The TI radar's points, in radar_link, 10 Hz, an empty cloud when it sees nothing. Best effort - subscribe best effort, or nothing matches. Clustered by radar_clusters (aav_radar_clusters, Rust); read by the local costmap's obstacle layer and collision_monitor where it runs (navigation.launch.py radar:=true). In Gazebo's road world, gazebo_radar makes them from a lidar shaped like the radar - the rays that hit something, with the TI driver's fields.
  /vehicle/battery:
    type: sensor_msgs/msg/BatteryState
    pub: [battery_state_publisher, mock_battery]
    sub: [hud, actuator_test, hw_panel]
    live: [bench]
    note: aav_battery_victron's node is battery_state_publisher (the Victron VE.Direct cable).
  /vehicle/battery/heartbeat:
    type: std_msgs/msg/String
    pub: [heartbeat_publisher]
    sub: []
    note: aav_battery_victron's sign of life.
  /sensors/camera/front_left/image_raw:
    type: sensor_msgs/msg/Image
    drop_in: {min_hz: 9, max_hz: 18, frame: camera_left_link}
    pub: [camera_left, mock_camera, test_camera, gz_road_bridge, gazebo_camera, carla_adapter, camera_stream_front_left, sim_cameras]
    sub: [object_detector, object_detector_orin, object_detector_laptop, object_detector_all, lane_finder, hud, sensor_watchdog, actuator_test, hw_panel]
    live: [bench, road]
    note: The front camera (camera_left_link). Big messages - subscribe reliably, as best effort loses them over UDP. camera_left is usb_cam (car.launch.py's camera part, Linux only); mock_camera draws the bench world; test_camera publishes a file; gz_road_bridge brings Gazebo's camera, in the road world (the bench camera's picture and lens). sim_cameras (aav_sim_cameras, Bevy offscreen) draws the same picture, lens, rate and frame for our own simulator (docs/own-simulator-cameras.md); the front right, rear and chase cameras too. With faults:=true, Gazebo's picture goes to gazebo_camera first (Gazebo's own /gazebo/camera/front_left/image_raw), which passes it on through its fault (freeze, stop). On the car with the camera stream (aav_camera_stream), camera_stream_front_left publishes it only with publish_image:=true - every undistorted picture, for another node on the same computer; the pictures otherwise stay inside it.
  /sensors/camera/front_left/image_raw/compressed:
    type: sensor_msgs/msg/CompressedImage
    pub: [camera_left, test_camera, mock_camera]
    sub: [object_detector, object_detector_laptop]
    note: The same pictures as JPEG, from image_transport's compressed plugin (usb_cam and image_publisher publish it by themselves; mock_camera only while something reads it). A detector on a laptop over WiFi reads this one (detector.launch.py compressed:=true; the laptop's machine file). On the bench, pixi run -e ml laptop-bench.
  /sensors/camera/front_left/camera_info:
    type: sensor_msgs/msg/CameraInfo
    pub: [camera_left, mock_camera, test_camera, gz_road_bridge, carla_adapter, camera_stream_front_left, sim_cameras]
    sub: [lane_finder, camera_obstacles, stop_sign_watcher]
    live: [bench, road]
    note: The lens. usb_cam reads aav_sensors/config/cameras/left.ini (the 2024-25 calibration). lane_finder takes its focal length and centre from here; camera_obstacles keeps each camera's by its frame_id; stop_sign_watcher its focal length (fy), to turn a stop sign's box height into a distance. camera_stream_front_left publishes the undistorted picture's lens (no distortion) with each picture's detections, once the camera has a calibration (aav_camera_stream config/cameras.yaml).
  /sensors/camera/front_right/image_raw:
    type: sensor_msgs/msg/Image
    drop_in: {min_hz: 9, max_hz: 18, frame: camera_right_link}
    pub: [gz_road_bridge, carla_adapter, camera_stream_front_right, sim_cameras]
    sub: []
    live: [road]
    note: The front right camera, beside the left one (camera_right_link). On the car its stream goes to camera_stream_front_right (aav_camera_stream), which publishes it only with publish_image:=true. Subscribe reliably, as for the front left one.
  /sensors/camera/front_right/camera_info:
    type: sensor_msgs/msg/CameraInfo
    pub: [gz_road_bridge, carla_adapter, camera_stream_front_right, sim_cameras]
    sub: [stop_sign_watcher]
    live: [road]
    note: Its lens. In Gazebo, the same as the front left camera's. stop_sign_watcher takes its focal length, as the front left one's. camera_stream_front_right publishes the undistorted picture's, as for the front left one.
  /sensors/camera/rear/image_raw:
    type: sensor_msgs/msg/Image
    pub: [gz_road_bridge, carla_adapter, sim_cameras]
    sub: []
    live: [road]
    note: The rear camera, looking back (the orange housing on the tailgate) (camera_rear_link). Gazebo's only, in the road world, for now - the car's drivers come with camera_ros (audit N4). Subscribe reliably, as for the front left one.
  /sensors/camera/rear/camera_info:
    type: sensor_msgs/msg/CameraInfo
    pub: [gz_road_bridge, carla_adapter, sim_cameras]
    sub: [stop_sign_watcher, camera_obstacles]
    live: [road]
    note: Its lens. In Gazebo, the same as the front left camera's. stop_sign_watcher takes its focal length, as the front left one's; camera_obstacles (off until Q22) uses it to put the rear camera's boxes on the road.
  /sensors/lidar/packets:
    type: velodyne_msgs/msg/VelodyneScan
    pub: [lidar_driver]
    sub: [lidar_cloud]
    live: [car]
    note: The roof Velodyne VLP-16's UDP packets as they come (the stock velodyne_driver, aav_sensors sensors.launch.py lidar:=true), one turn (0.1 s, about 76 packets) a message, frame lidar_link. It reads only packets from lidar_ip (192.168.1.201, the 16 Oct audit) on lidar_port (2368), so it runs on the computer they're sent to - the Jetson. lidar_cloud turns them into /sensors/lidar/points. In bench mode (lidar:=true), mock_lidar sends it the bench world's packets on 127.0.0.1:2369, so the same driver runs.
  /sensors/lidar/points:
    type: sensor_msgs/msg/PointCloud2
    drop_in: {min_hz: 9, max_hz: 12, frame: lidar_link, reliable: true}
    pub: [lidar_cloud, gz_lidar_bridge, carla_adapter, simulator]
    sub: [lidar_scan, voxels, debug_hud, ndt, kiss_icp, actuator_test, hw_panel]
    live: [road, car]
    note: On the car, the roof Velodyne VLP-16 through the stock velodyne_pointcloud (lidar_cloud, its factory calibration VLP16db.yaml), in lidar_link, 10 Hz, 0.9-100 m, unorganised - rays that hit nothing are left out; fields x, y, z, intensity, ring, time. car.launch.py runs it where the machine file has the lidar part (orin, all); lidar:=false turns it off everywhere. In Gazebo, a generic 16-beam roof lidar (like a VLP-16) in lidar_link, 10 Hz, 1800 x 16 points, 0.5-100 m, inf where a ray hit nothing. Reliable (about 0.9 MB a cloud). On by default in the road and test_lot worlds (lidar:=false turns it off). Its one reader for Nav2 is lidar_scan (navigation.launch.py lidar:=true), which flattens it into /sensors/lidar/scan; or, in the voxels trial (voxels:=true), voxels, which cuts it into cubes (/perception/voxels/cubes).
  /sensors/lidar/scan:
    type: sensor_msgs/msg/LaserScan
    pub: [lidar_scan]
    sub: [local_costmap, collision_monitor, amcl, behaviour]
    live: [road, car]
    note: The roof lidar flattened (aav_lidar lidar_scan - navigation.launch.py lidar:=true) - in base_link, 720 ranges all the way round, each the nearest point between 0.3 m and the roof plus 0.5 m (vehicle.obstacle_heights), inf where there is none. Best effort, 10 Hz. Read by the local costmap's lidar_layer and collision_monitor's stop zone. From the roof, the lowest beam (15 degrees down from 1.8 m) meets a 1 m box only 3 m away, so low things close in front are the radar's.

  # --- perception ---
  /perception/voxels/cubes:
    type: sensor_msgs/msg/PointCloud2
    drop_in: {min_hz: 9, max_hz: 12, frame: base_link, reliable: true}
    pub: [voxels]
    sub: [local_costmap, collision_monitor, debug_hud, dev_window, things]
    note: A trial (docs/designs/2026-10-30_voxels.md), only with navigation.launch.py voxels:=true (or screen_cubes:=true, or things:=true - then only the developer window and aav_things read it) (sim.launch.py and car.launch.py pass it on; needs the lidar) - the roof lidar's cloud as 0.25 m cubes (aav_voxels voxels), in base_link, the cloud's stamp, 10 Hz. Fields x, y, z (float32) - the centre of every cube holding a point between 0.3 m and the roof plus 0.5 m (vehicle.obstacle_heights) above the road, the road's plane fitted to each cloud (so a leaning car doesn't see the road as an obstacle); the car's own body left out; out to 30 m. Reliable, depth 1. Then the local costmap's lidar_layer marks with it and collision_monitor's voxels source stops for it, instead of /sensors/lidar/scan. The debug HUD draws it as red wireframes over its own cubes (key V), placed with the local EKF's pose at the cloud's stamp.
  /perception/voxels/ground:
    type: sensor_msgs/msg/PointCloud2
    pub: [voxels]
    sub: [local_costmap, dev_window]
    note: The voxels trial's road - in base_link, the centre of every flat 0.25 m square where the lidar saw the fitted road (within 0.15 m of it), z on that plane. Free space - the local costmap's lidar_layer clears with it (marking false), as the scan's inf rays did. Reliable, depth 1, with each cube cloud.
  /perception/voxels/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [voxels]
    sub: [debug_hud]
    note: The voxels trial after every cloud - name voxels, level OK (the road fitted) or WARN (no good fit - taken as flat, as lidar_scan does); values ms (wall clock, the cloud read to the cubes published), cubes, ground_cubes, points (finite, off the car, in range), fitted, roll_deg, pitch_deg (the body's lean on the fitted road, REP-103), clouds_dropped (from the stamps). sim-check --voxels and measure controllers --voxels read it; so does the debug HUD (its Nav2 cubes section and row).
  /perception/radar/clusters:
    type: sensor_msgs/msg/PointCloud2
    pub: [radar_clusters]
    sub: [things]
    live: [bench, road]
    note: The radar points DBSCAN grouped into objects (radar_clusters, aav_radar_clusters, Rust), coloured by cluster, with each point's cluster number in a cluster field; noise left out. The radar cloud's frame and time.
  /perception/radar/cluster_boxes:
    type: visualization_msgs/msg/MarkerArray
    pub: [radar_clusters]
    sub: []
    live: [bench, road]
    note: A box round each radar cluster, for RViz - a DELETEALL first, then one CUBE per cluster, its id the cluster number.
  /perception/detections:
    type: vision_msgs/msg/Detection2DArray
    pub: [object_detector, object_detector_orin, object_detector_laptop, object_detector_all, camera_stream_front_left, camera_stream_front_right]
    sub: [stop_sign_watcher, camera_obstacles, sensor_watchdog]
    note: The object detector's boxes in pixels (RF-DETR Nano by default, or YOLO); header.frame_id names the camera, results[0].hypothesis is the label (e.g. "stop sign") and score. Needs PyTorch - the ml environment, or JetPack's on the Orin. object_detector (aav_detector) in bench mode and pixi run detect; on the car object_detector_<machine>, one per machine with a GPU (car.launch.py's detector part), all on this topic. Not live in car yet - the Orin's waits for JetPack 7.2 (Q24); the laptop's reads the camera's compressed pictures (pixi run -e ml car laptop). With the camera stream (decided 23 Oct; docs/camera-pipeline.md), camera_stream_<camera> runs the same detector (RF-DETR Nano) inside the process that decodes the camera Pi's H.264 stream, one per camera, also on this topic - its boxes in the undistorted picture's pixels, stamped with the picture's arrival minus the stream's measured delay. It sends one for every picture, boxes or none, so the sensor watchdog watches each streamed camera here (kind detections, by its frame_id - front_left_stream, front_right_stream; silent 1 s locks Nav2 and the AI slot), where car.launch.py starts the streams (its camera_stream part, the Orin), and the car's detector part then doesn't start for those cameras.
  /perception/camera/front_left/preview/compressed:
    type: sensor_msgs/msg/CompressedImage
    pub: [camera_stream_front_left, preview_jpeg_front_left]
    sub: [foxglove_bridge]
    note: A small JPEG of the undistorted picture with the boxes drawn on, 320 px wide, once a second (preview_period, preview_width) - for Foxglove, Lichtblick (tools/foxglove/driving.json) or the HUD; a few kB, so it fits WiFi. People can also watch the camera Pi's own stream in a browser (WebRTC, http://<pi>:8889/front_left). On the stand-ins (sim, bench, CARLA with foxglove:=true), preview_jpeg_front_left makes it instead (image_transport republish, foxglove.launch.py) - the whole picture, no boxes, once a second.
  /perception/camera/front_left/preview:
    type: sensor_msgs/msg/Image
    pub: [preview_throttle_front_left]
    sub: [preview_jpeg_front_left]
    note: Stand-ins only (foxglove.launch.py foxglove_preview, with foxglove:=true) - the camera's raw picture once a second (topic_tools throttle), on its way to preview/compressed. The bridge's WiFi list leaves it out.
  /perception/camera/front_right/preview/compressed:
    type: sensor_msgs/msg/CompressedImage
    pub: [camera_stream_front_right]
    sub: []
    note: The same, for the front right camera.
  /perception/detections/image:
    type: sensor_msgs/msg/Image
    pub: [object_detector, object_detector_orin, object_detector_laptop, object_detector_all]
    sub: []
    note: The camera picture with the boxes drawn on, for RViz or Foxglove.
  /perception/stop_sign:
    type: std_msgs/msg/Bool
    pub: [stop_sign_watcher]
    sub: [twist_mux, hud, language_drive, behaviour]
    live: [car]
    note: true while the car stops for a stop sign. A twist_mux lock at priority 30 - it holds Nav2 and the AI slot, never a person; never expires on silence. On the car, the stop_signs part - one watcher, on the machine with the mux.
  /perception/stop_sign/distance:
    type: geometry_msgs/msg/PointStamped
    pub: [stop_sign_watcher]
    sub: [behaviour]
    note: Where the tallest stop sign a forward camera sees is (sign_point, aav_detector stop_sign.py) - in that camera's frame (camera_left_link, or an _optical frame) at the picture's stamp, so a reader moves it with /tf at that stamp. The range along the camera's axis from the box's height and the lens (the same rule as the lock, sign_distance_m), the bearing from the box's centre column and the CameraInfo's fx and cx (straight ahead with no CameraInfo). Published with each detections message, only while the watcher is CLEAR and only for a frame naming front, left or right and not rear (forward_words, backward_words). For aav_behaviour's slowing before the lock; the lock itself is unchanged.
  /perception/camera_obstacles:
    type: sensor_msgs/msg/PointCloud2
    pub: [camera_obstacles]
    sub: [local_costmap, collision_monitor]
    note: Where each detected object stands on the road, in base_link (z = 0) - points 0.1 m apart along its box's bottom edge, out to 12 m from the camera. Each message carries every camera's newest points (those heard in the last max_age, 1 s), so the rear camera's stay while the front one's pictures come in. Only the listed COCO classes (people, cyclists, cars...), never stop signs. The local costmap's camera layer marks them, and with camera_guard (the car, once a detector reads the rear camera for people) collision_monitor stops for them, ahead going forward and behind reversing - bench.launch.py camera_obstacles:=true, or the car's camera_obstacles part next to navigation. Off until the cameras are calibrated (Q22).
  /perception/camera_view:
    type: sensor_msgs/msg/PointCloud2
    pub: [camera_obstacles]
    sub: [local_costmap]
    note: The far edge of what the cameras see (each one heard in the last second), on the road, 12 m out, in base_link. The camera layer clears up to it before it marks, so old boxes don't linger.

  /perception/lane/geometry:
    type: aav_lane_geometry/msg/LaneGeometry
    pub: [lane_finder, fake_lane_geometry_pub]
    sub: [control_interface, lane_pose]
    note: "One per camera picture, from lane_finder (aav_lane_finder, classic OpenCV), in base_link. vehicle_offset_m - the car from the lane's centre, 3 m ahead (lookahead), + = the car is left of it. Each line as y = a x^2 + b x + c (m), its radius (m; 9999 = straight or not seen) and confidence (0-1); the lane width (m). Bench - lane:=true runs lane_finder, lane:=fake runs fake_lane_geometry_pub (its polynomials are pixels)."
  /perception/lane/image:
    type: sensor_msgs/msg/Image
    pub: [lane_finder]
    sub: []
    note: The bird's-eye view, with the paint, the windows and the lines lane_finder found, for RViz or Foxglove. Only with debug_image true.
  /drivers/ai/lane_status:
    type: std_msgs/msg/String
    pub: [control_interface]
    sub: []
    note: Lane keeping's state and numbers, as text. Under /drivers/ai, as control_interface (the AI slot's driver) publishes it.
  /drivers/ai/lane_state:
    type: std_msgs/msg/String
    pub: [control_interface]
    sub: []
    note: Lane keeping's state machine (LANE_KEEP, LANE_CHANGING, ...). Not the car's state - that's /vehicle/status.

  # --- bench mode: the stand-ins' own topics ---
  /vehicle/bench/truth:
    type: nav_msgs/msg/Odometry
    pub: [spine_sim]
    sub: [mock_imu, mock_gps, mock_camera, mock_radar, mock_lidar]
    live: [bench]
    note: Where the model car really is (map frame, 50 Hz). Only the stand-ins read it; compare it with /localization/odom/global to check the EKFs.
  /vehicle/bench/hw_estop:
    type: std_msgs/msg/Bool
    pub: []
    sub: [spine_sim]
    note: true = press the hardware e-stop, on the bench and in Gazebo's spine profile; false = release it. The spine brakes, and needs arming again.
  /vehicle/bench/driver_faults:
    type: std_msgs/msg/UInt16
    pub: []
    sub: [spine_sim]
    note: Pretend a driver failed, on the bench and in Gazebo's spine profile. Fault bits as in VehicleStatus (8 = steering, 16 = brake, 32 = throttle DAC, 64 = encoder).

  # --- Gazebo's road world: the simulator's own ---
  /vehicle/sim/truth:
    type: nav_msgs/msg/Odometry
    pub: [gz_bridge, simulator]
    sub: [gazebo_gps, debug_hud, sim_cameras]
    live: [sim]
    note: Where the Gazebo car really is (map frame - the world's origin is the datum - 50 Hz), like the bench's /vehicle/bench/truth. Only the stand-ins read it - gazebo_gps, for the receiver's velocity (/sensors/gps/fix_velocity), never for a position; tools/sim_check.py compares it with /localization/odom/global. Gazebo's other topics (/gazebo/odom, imu, navsat, cmd_vel, radar/points) only link the bridges, gazebo_adapter and the sensor nodes (gazebo_imu, gazebo_gps, gazebo_radar, gazebo_camera - one process per sensor, as on the car). With simulator:=own, our own Rust simulator (aav_simulator's node simulator) publishes every one of those Gazebo topics itself, in place of gz sim and its bridges, and the same nodes read them.
  /vehicle/sim/chase_camera/image_raw:
    type: sensor_msgs/msg/Image
    pub: [gz_chase_bridge, sim_cameras]
    sub: [chase_jpeg, dev_window]
    live: [road]
    note: Gazebo's chase camera (aav_description aav.sensors.gazebo.xacro, chase_camera:=true, the default in sim.launch.py) - 7 m behind the rear axle and 3.5 m up, fixed to the car, 640 x 360 RGB, 10 Hz, frame base_link. Only where the world renders sensors (road, test_lot); never on the car. Big (6.9 MB/s), so the bridge's WiFi list leaves it out (image_raw); chase_jpeg makes the JPEG Lichtblick shows.
  /vehicle/sim/chase_camera/compressed:
    type: sensor_msgs/msg/CompressedImage
    pub: [chase_jpeg]
    sub: [foxglove_bridge]
    live: [road]
    note: The chase camera as JPEG, every picture (10 Hz, about 30 kB each) - image_transport republish (chase_jpeg, aav_gazebo gazebo.launch.py). For Lichtblick's cockpit layout (tools/foxglove/cockpit.json), so it shows Gazebo's picture without Gazebo's window. Sim only - the car has no such topic.
  /vehicle/sim/spine_outputs:
    type: aav_interfaces/msg/SpineOutputs
    pub: [spine_sim]
    sub: [gazebo_adapter]
    live: [spine]
    note: Gazebo's spine profile only (sim.launch.py spine:=true). What the spine's logic (spine-core, in spine_sim) writes to its actuator drivers each tick, 100 Hz on Gazebo's clock - throttle and brake (0..1), reverse, the steering target (rad). On the car these never reach ROS. gazebo_adapter's actuator model turns them into what Gazebo's car does; silent for 0.2 s, it brakes fully.
  /vehicle/sim/entities:
    type: visualization_msgs/msg/MarkerArray
    pub: [simulator]
    sub: [sim_cameras]
    live: []
    note: Our simulator only (simulator:=own). Every model placed while it runs (obstacle:=true, /vehicle/sim/spawn_entity), latched (transient local), sent again whole after each change - a DELETEALL, then one MESH_RESOURCE marker each - ns the model's name, mesh_resource its SDF file (file://), pose in the map frame. sim_cameras reads each SDF file and draws the model, so the cameras see what the rays hit. Gazebo has no such topic - its cameras see its own world.
  /vehicle/sim/esp32_outputs:
    type: aav_interfaces/msg/SpineOutputs
    pub: [gazebo_esp32]
    sub: [gazebo_adapter]
    live: []
    note: Gazebo with today's car in the loop only (sim.launch.py esp32:=true). What gazebo_esp32 - the 2025-26 C++ ESP32 firmware's logic, standing in behind the real legacy_uart_bridge - drives, 50 Hz - throttle (its DAC over 700, ramped 6 up and 12 down per frame), brake (the Jrk's travel past 400), reverse, the steering target (rad). gazebo_adapter's actuator model turns them into what Gazebo's car does, and still publishes /vehicle/odom itself, as the wheel sensors on today's car. Like the C++, no command timeout - the outputs stay when frames stop.
  /vehicle/sim/wheels:
    type: aav_interfaces/msg/WheelSpeeds
    pub: [gazebo_adapter]
    sub: [spine_sim]
    live: [spine]
    note: Gazebo's spine profile only. Gazebo's four wheels, as /vehicle/wheels in the direct profile, for spine_sim - the front two for its wheel nodes' frames, the rear two's mean as the spine's measured speed (its motor encoder).
  /vehicle/sim/steering:
    type: aav_interfaces/msg/ActuatorState
    pub: [gazebo_adapter]
    sub: [spine_sim]
    live: [spine]
    note: Gazebo's spine profile only. command = the spine's steering target, measured = the actuator model's angle, which spine_sim sends back in VEHICLE_FEEDBACK.

  # --- CARLA: the simulator's own ---
  /vehicle/carla/truth:
    type: nav_msgs/msg/Odometry
    pub: [carla_adapter]
    sub: []
    note: Where the CARLA car really is (base_link in the map frame, each CARLA step), like /vehicle/sim/truth. The map frame is CARLA's world when its map is built round the datum (a Carleton map, osm:=), else the spawn point facing east (aav_carla frames.map_frame). Nothing on the car's side reads it. carla_adapter (aav_bringup carla.launch.py, pixi run carla-car) has never run against a CARLA server, so no profile checks its topics yet (docs/carla.md).

  # --- localization ---
  /localization/odom/local:
    type: nav_msgs/msg/Odometry
    pub: [ekf_local]
    sub: [controller_server, bt_navigator, scripted_driver, language_drive, actuator_test, sensor_watchdog, debug_hud, ndt, localization_health, dev_window, behaviour, ego, things, hud]
    live: [turtle, sim, car, replay, bench]
    note: odom frame. Smooth; drifts.
  /localization/odom/global:
    type: nav_msgs/msg/Odometry
    pub: [ekf_global]
    sub: [navsat_transform, map, sensor_watchdog, point_driver, point_cli, debug_hud, ndt, geofence, localization_health, dev_window, behaviour]
    live: [sim, car, replay, bench]
    note: map frame. Includes GPS; can jump. The map window (map, aav_hud) draws the car from it.
  /localization/gps/odom:
    type: nav_msgs/msg/Odometry
    pub: [navsat_transform]
    sub: [ekf_global, geofence]
    live: [sim, car, replay, bench]
    note: Each GPS fix as a map-frame position of base_link (antenna offset removed).
  /localization/gps/heading:
    type: sensor_msgs/msg/Imu
    pub: [gps_heading]
    sub: [ekf_global]
    live: [sim, car, replay, bench]
    note: The car's heading from the GPS receiver's velocity (aav_gps_heading, TODO 13) - only an orientation (yaw from east), in base_link, with its variance; turn rate and acceleration covariance -1. Only while the car moves faster than 0.3 m/s and the GPS's speed matches the wheels'; turned round when reversing. The global EKF fuses its yaw. Silent where nothing publishes /sensors/gps/fix_velocity (the bench, gps_driver:=nmea).
  /localization/amcl/pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    pub: [amcl]
    sub: [controller_compare, debug_hud]
    note: A trial (docs/trials.md) - stock nav2_amcl's particle filter on the 2D map and the lidar scan, map frame (its amcl_pose, renamed). Only with amcl:=true (sim.launch.py world:=test_lot nav:=true lidar:=true). Its tf_broadcast is false - ekf_global keeps map -> odom - so nothing drives by it; measure controllers --amcl scores it against Gazebo's truth. Published only once the car has moved (update_min_d, update_min_a).
  /localization/amcl/particles:
    type: nav2_msgs/msg/ParticleCloud
    pub: [amcl]
    sub: [debug_hud]
    note: AMCL's particles, for RViz, Foxglove and the debug HUD (small orange arrows; its particle_cloud, renamed). Best effort. amcl:=true only.
  /localization/amcl/map:
    type: nav_msgs/msg/OccupancyGrid
    pub: [amcl_map_server]
    sub: [amcl]
    note: AMCL's own map, transient local (latched) - the test lot at 0.05 m, each obstacle only its outline (aav_navigation maps/example_lot_amcl.yaml, from the spec's amcl section; maps/README.md says why). Only with amcl:=true and amcl_map:= (sim.launch.py sets it). Without amcl_map, AMCL reads /map.
  /localization/amcl/initial_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    pub: []
    sub: [amcl]
    note: Starts AMCL again from a pose (its initialpose, renamed; RViz "2D Pose Estimate" publishes /initialpose, so set its topic to this). amcl:=true starts it from the sim's start pose without it (set_initial_pose).
  /localization/lane/pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    pub: [lane_pose]
    sub: [ekf_global]
    note: A trial (TODO 155) - the lane finder as a pose sensor (aav_lane_pose). Map frame, the camera picture's stamp. From /perception/lane/geometry's lines and the lane map (a lanes.yaml), the car's place across its lane; along the lane, where TF map -> base_link already has it. Its x, y covariance is turned to the lane's heading - 0.15 m across with both lines (0.30 with one), 50 m along - so it corrects only sideways; yaw (the lane's heading less the car's angle to the lines, 0.05 rad) is in the message, not fused. Only pictures that pass the gates - a line sure enough, the car within 0.3 rad of the lane, the lines' angle within 0.05 rad of the filter's and their bend within 0.003 1/m of the map lane's, the map's lane width, no junction or road end from 4 m behind to 12 m ahead, no jump over 0.4 m, within 1.5 m of the filter. Only with lane_pose:=true (sim.launch.py, localization.launch.py; off by default); then ekf_global fuses x and y (pose0, or pose1 after NDT's; refused past 5 sigma; aav_localization config/ekf_global_lane.yaml).
  /localization/ndt/pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    pub: [ndt]
    sub: [debug_hud, ekf_global, dev_window]
    note: A trial (docs/designs/2026-10-29_ndt.md) - where NDT (aav_ndt, Rust) puts base_link on the saved lidar map, map frame, stamped with the cloud's own stamp. Only good fits (score per point above min_score_per_point, converged, and while tracking no further than max_correction_m / max_correction_deg from the odometry's guess); x, y and yaw only, height, roll and pitch held at 0. Covariance - the x, y, yaw block k (-H^-1) with a floor, the rest 1e3; k fitted in Gazebo (NEES, docs/trials.md). Only with ndt:=true or ndt_ekf:=true (sim.launch.py world:=test_lot lidar:=true, the map file present). With ndt_ekf:=true (a trial, off by default) ekf_global fuses its x, y and yaw beside the GPS (pose0, refused past 5 sigma; aav_localization config/ekf_global_ndt.yaml); otherwise nothing reads it to drive. It never publishes TF. The debug HUD draws it (a purple car).
  /localization/ndt/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [ndt]
    sub: [debug_hud, dev_window]
    note: NDT's state after every cloud - name ndt, level OK (a good fit), WARN (a poor fit, or no start yet) or ERROR (LOST), message TRACKING, WAITING or LOST and why; values stamp (the cloud's, s), score_per_point, overlap, iterations, match_ms (wall clock, the match alone), points (after the filters), poor_in_row, restarts (from ekf_global after LOST), clouds_dropped (arrived while one was being matched), x, y, yaw, and for a fit cov_xx, cov_xy, cov_xyaw, cov_yy, cov_yyaw, cov_yawyaw (-H^-1 before the scale k and the floors, to fit k). WARN's why says which poor fit - score too low, out of iterations, or jumped from the guess. The debug HUD's panel shows it; measure controllers --ndt scores it.
  /localization/ndt/initial_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    pub: []
    sub: [ndt]
    note: Starts NDT again from a pose in the map frame (RViz "2D Pose Estimate" set to this topic). ndt:=true in Gazebo starts it from the sim's start pose without it (its start_x, start_y, start_yaw); on the car it would take ekf_global's (start_from_global).
  /localization/kiss_icp/odom:
    type: nav_msgs/msg/Odometry
    pub: [kiss_icp]
    sub: [ekf_local]
    note: A trial (docs/designs/2026-10-30_kiss-icp.md) - lidar odometry by KISS-ICP (MIT, PRBonn; aav_kiss_icp, its PyPI wheel in the kiss Pixi environment, run as a child program). How far base_link moved, from the lidar alone - frame kiss_odom (its own, where the car was at the first scan; drifts), child base_link, stamped with the cloud's stamp. Twist in base_link from the last step over the time between clouds. KISS-ICP gives no covariance - the pose's is a fixed 1, the twist's the node's twist_linear_sd and twist_angular_sd (0.15 m/s, 0.01 rad/s, measured against Gazebo's truth 1 Nov). Only with kiss_icp:=true or kiss_ekf:=true (sim.launch.py, a world with the lidar). Never TF. With kiss_ekf:=true (a trial, off by default) ekf_local fuses its twist - vx and vyaw only, never its pose (it drifts, in its own frame) - beside the wheels and the IMU (odom1, refused past 5 sigma; aav_localization config/ekf_local_kiss.yaml); otherwise nothing reads it to drive. measure controllers --kiss-icp scores it against Gazebo's truth and ekf_local; --kiss-ekf scores ekf_local with it.
  /localization/kiss_icp/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [kiss_icp]
    sub: []
    note: KISS-ICP's state after every cloud - name kiss_icp, level OK (TRACKING) or ERROR (no kiss environment, a cloud without x, y, z, or the worker failed); values match_ms (wall clock, KISS-ICP alone), points (after the body, ground - below min_height, 0.3 m - and range cuts), deskew (true only where the cloud has a per-point time - the VLP-16, not Gazebo), clouds, clouds_dropped, restarts (of the worker).
  /localization/gps/fix:
    type: sensor_msgs/msg/NavSatFix
    pub: [navsat_transform]
    sub: [hud, street_router]
    live: [sim, car, replay, bench]
    note: The global EKF's position as lat/lon, for maps in the HUD or Foxglove, and the start of street_router's routes.
  /localization/health:
    type: std_msgs/msg/String
    pub: [localization_health]
    sub: [debug_hud]
    live: [turtle, sim, car, replay, bench]
    note: localization_health (aav_localization_health) once a second - OK, or WARN and each check that isn't OK (gyro_bias parked, imu_mounting, gps_quality, timestamps, frames, tf, wheels, motion; STALE where an input it needs went quiet). Warn only - nothing drives from it, and it changes nothing in the EKFs. The same checks, with their numbers, on /diagnostics. The debug HUD shows it (green OK, amber WARN with each check).

  # --- navigation ---
  /global_costmap/costmap:
    type: nav_msgs/msg/OccupancyGrid
    pub: [global_costmap]
    sub: [dev_window]
    live: [sim, car]
    note: Nav2's whole costmap, as a grid. The developer window draws it on the map. Nav2's own name.
  /map:
    type: nav_msgs/msg/OccupancyGrid
    pub: [map_server]
    sub: [global_costmap, local_costmap, map, dev_window, things]
    live: [sim]
    note: Transient local (latched). From aav_navigation/maps. things reads it only with background true (its walls are not things). AMCL reads it too when launched without amcl_map:= (the sim gives it /localization/amcl/map). The map window (map, aav_hud) draws it north up, for the big screen.
  /goal_pose:
    type: geometry_msgs/msg/PoseStamped
    pub: [rviz2, map, dev_window]
    sub: [bt_navigator, navigator, map]
    note: RViz "2D Goal Pose", or the map window's place search (map, aav_hud - only after DRIVE HERE then CONFIRM, map frame, facing from the car, refused off Nav2's /map or with no car), starts a navigate_to_pose. The map window shows it until Nav2 plans for it.
  /local_costmap/costmap:
    type: nav_msgs/msg/OccupancyGrid
    pub: [local_costmap]
    sub: [look_ahead]
    live: [sim, car]
    note: Nav2's own name - the local costmap as a grid, odom, rolling with the car. look_ahead (aav_ego) finds the first obstacle ahead of the stop point in it.
  /drivers/nav/local_plan:
    type: nav_msgs/msg/Path
    pub: [controller_server, mppi_lag]
    sub: [look_ahead]
    note: What the path follower WANTS over its own horizon - the future its chosen commands lead to, odom. Nav2's MPPI (controller:=mppi, the default; nav2.yaml visualize true, its optimal_trajectory renamed here, sent only while someone listens) or aav_mppi_lag (tracker:=mppi_lag, every tick). Regulated Pure Pursuit and aav_track's trial trackers have none - then look_ahead falls back to /plan. Only while a path runs.
  /plan:
    type: nav_msgs/msg/Path
    pub: [planner_server, diffusion_planner, planner]
    sub: [map, debug_hud, dev_window, look_ahead, behaviour, costmap]
    note: The planned path, for RViz/Foxglove, and the map window (map, aav_hud) - the line, the goal (its last point) and the distance left along it. The dev window marks its last point as the goal while plans keep coming (within 5 s), whoever sent the goal. Nav2 plans again every second while it drives. Which planner makes it is navigation.launch.py planner:= (docs/controllers.md, Planners) - hybrid (SmacPlannerHybrid, the default) or lattice (SmacPlannerLattice, our own primitives) keep to the car's turning radius; smac2d, navfn and theta_star, trials in sim and bench only, don't. Always the plugin GridBased, so the behaviour trees never change. With planner:=diffusion (aav_diffusion_planner, a trial) diffusion_planner publishes it - the path it returned, the model's or the lattice's - and planner_server's own goes to /drivers/nav/diffusion/lattice_plan. With planner:=own (aav_planner, a trial) our planner node publishes it - each path it returns - and planner_server's own goes to /drivers/nav/planner/nav2_plan. With lane_costs (costmap:=own, a challenger, TODO 148) our costmap reads it too - the way the route drives each road, so the lanes layer is lowest in the right lane.

  # --- our own planner (aav_planner, a trial beside Nav2's: docs/own-planner.md) ---
  /drivers/nav/planner/nav2_plan:
    type: nav_msgs/msg/Path
    pub: [planner_server]
    sub: []
    note: Only with planner:=own - planner_server's own /plan, renamed - Nav2's lattice's path, when something still asks it (navigate_through_poses, controller_compare's head-to-head).
  /drivers/nav/navigator/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [navigator]
    sub: []
    note: Only with navigator:=own (aav_navigator, a trial; docs/own-navigator.md) - 2 Hz and at each goal's end. name navigator; level OK, or WARN while recovering; message the step (idle, planning, following, recovering - clearing costmaps or backing up). values step, succeeded, failed (goals since start), last_end (the last goal's number and how it ended), and with a goal running goal, distance_remaining_m (along the path), recoveries, waypoint (passed, or driven to), poses_remaining.
  /drivers/nav/planner/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [planner]
    sub: []
    note: Only with planner:=own - one a plan. name planner; level OK (a path) or ERROR (none - message why, values error_code and failures). values search_ms, total_ms (with smoothing), iterations, length_m, cusps, poses, plans and failures since the node started.

  /drivers/nav/diffusion/lattice_plan:
    type: nav_msgs/msg/Path
    pub: [planner_server]
    sub: []
    note: Only with planner:=diffusion - planner_server's own /plan, renamed - the lattice's path for each plan, the fallback, whether or not the car got it.

  /cmd_vel_nav:
    type: geometry_msgs/msg/TwistStamped
    pub: [controller_server, behavior_server, track, mppi_lag]
    sub: [velocity_smoother]
    note: Nav2's own name, inside Nav2 - the path follower's command, before the velocity smoother, collision_monitor and /drivers/nav/cmd_vel. controller_server publishes it (tracker:=none, the default), or aav_track's track node with a trial tracker on (tracker:=pure_pursuit|stanley|lqr|mpc|mpc_full|mpc_lag, docs/trials.md), or aav_mppi_lag's mppi_lag node (tracker:=mppi_lag, docs/mppi-lag.md); never both - the tracker takes /follow_path and controller_server's is renamed /follow_path_unused. behavior_server's Wait and DriveOnHeading too.
  /drivers/nav/diffusion/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [diffusion_planner]
    sub: [controller_compare]
    note: Only with planner:=diffusion (aav_diffusion_planner, a trial) - one a plan. name diffusion_planner; level OK (the model's path), WARN (the lattice's - the fallback) or ERROR (neither); message the source and why (no model answer, every sample failed the guard, late). values source, why, model_ms, model_and_guard_ms (against budget_ms, 150), total_ms, samples, samples_passed, lattice_ms, refused_G1..G8 (samples failing each check, this plan) and refused_G*_total, plans, from_model, share_from_model (since the node started), and with the model's path length_m, cusps, lattice_length_m, gap_to_lattice_m.

  /drivers/nav/track/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [track, mppi_lag]
    sub: [controller_compare, debug_hud]
    note: aav_track's debug, every tick while it follows a path (20 Hz) - name track, message the tracker's name; values tracker, loop_ms (this tick's work), loop_ms_max, missed_ticks (since the path came, by the node's clock), cross_track_m (+ left of the path), heading_error_rad, steer_rad, speed_mps, left_m (along the path to its end). Only with tracker:= on. aav_mppi_lag's mppi_lag (tracker:=mppi_lag) publishes the same keys, message mppi_lag, and adds model (lag or ideal), est_steering_rad (its model's wheel angle), best_cost and collided_share (MPPI's cheapest sample, the share of samples that hit the costmap).
  /drivers/nav/speed_limit:
    type: nav2_msgs/msg/SpeedLimit
    pub: [behaviour]
    sub: [controller_server]
    note: Only with behaviour:=true (navigation.launch.py, a trial - aav_behaviour, docs/stopping.md), 20 Hz - Nav2's speed cap, absolute m/s (percentage false), from the stopping law (aav_description stop_law.py, v_cap of the metres left to a stop sign's line, an obstacle in the lane, the fence or the goal). 0.0 means no limit to Nav2, so a cap is 0.0 or between the floor (0.3 m/s) and Nav2's own top speed, never lower - the cap slows the car, the locks and Nav2's goal check stop it. controller_server reads it as its speed_limit_topic only with behaviour:=true; it keeps the last value for ever, so a dead node leaves the car slower, never faster (respawn brings it back in DRIVE, sending 0.0). Trial trackers (tracker:=) don't read it yet.
  /drivers/point/plan:
    type: nav_msgs/msg/Path
    pub: [point_driver]
    sub: [behaviour]
    note: Latched (transient local), frame map - a drive to a point's line A -> B while it runs, empty when it ends. The behaviour planner builds the road ahead from it while it runs (it outranks /plan, as the point driver outranks Nav2 in twist_mux), so the lane obstacle check, the stop sign and ego's road-ahead limit hold the point driver too (docs/designs/2026-11-14_the-whole-car.md, R5).
  /world/road_ahead:
    type: aav_interfaces/msg/RoadAhead
    pub: [behaviour]
    sub: [ego, look_ahead, dev_window, mppi_lag, track]
    note: Only with behaviour:=true, 10 Hz, frame map - the road ahead (docs/designs/2026-11-14_the-whole-car.md). The behaviour planner is its only writer. The line is /plan's next 40 m from the car's foot, a point every 0.5 m; stops (sign, obstacle WAIT; fence, goal FINAL) sit on it; the end is the nearest stop or the line's last point, and the car may not pass it (a movement authority - silence means the car runs out of road and stops, never carry on). speed_limit per point is the stopping law's cap for the room left to the end (aav_description stop_law.py), never above the base speed, 0 at the end. With a lane map (behaviour lane_map, sim.launch.py lane_map:=world - aav_description lane_map.py, a lanes.yaml) the line is the car's lane's centre along the route (the rightmost lane for the way the route runs) and the four edges are metres from each point to the lane's lines (soft) and the kerbs (hard), NaN where a point is on no road; without one the line is the plan's and the edges NaN. Made from /plan, or from /drivers/point/plan while a drive to a point runs. Readers use aav_description road_ahead.py (limit_at). ego (road_ahead:=true, set by behaviour:=true) holds Nav2's and the point driver's forward speed under it (people never trimmed); Nav2's controller still reads /drivers/nav/speed_limit too. mppi_lag (tracker:=mppi_lag with a lane map, navigation.launch.py) reads the line and edges, moved into odom, for its LaneCritic - the car's outline past a soft edge costs, past a hard edge far more (docs/mppi-lag.md, The lane). track (aav_track's followers, with a lane map) moves each new path's points sideways inside the soft edges, less half the car and a margin (aav_track lane.py, TODO 169).
  /world/things:
    type: aav_interfaces/msg/Things
    pub: [things]
    sub: [behaviour, stop_sign_watcher, hud, dev_window]
    note: Only with things:=true (navigation.launch.py, sim.launch.py; needs the lidar, and voxels runs for it), 10 Hz, frame odom - every thing near the car, one list (docs/designs/2026-11-14_the-whole-car.md, Seeing - things, not just points). aav_things groups /perception/voxels/cubes (cubes within 0.6 m make a thing; walls over 8 m left to the map), follows each with a constant-velocity Kalman filter (greedy nearest association, 2 m gate - AB3DMOT's simple baseline), and lists it once seen in 3 clouds. Each Thing - id (kept while listed), kind (unknown, or with things_names:=true the camera detector's label where the thing's box overlaps one - person, car, stop sign - held 3 s, TODO 192; stop_sign_watcher then takes a named stop sign's distance from the lidar), x, y, vx, vy (m, m/s over the ground), length, width, height, position_sigma, confidence, last_seen, seen, radar (its speed along the radar's ray from /perception/radar/clusters too, radar:=true), coasting (not in the last cloud - moved on its speed; slower than 0.5 m/s taken as parked). Kept 3 s unseen, 30 s within 4 m of base_link (the blind zone before the bumper). The behaviour planner reads it. The screens draw it (hud_core::things - each box in its kind's colour, person yellow, vehicle blue, stop sign red, other names green, unknown orange) - the HUD in AHEAD (placed with /localization/odom/local; named things past its 6 m drawing listed along its top, such as STOP SIGN 12 m), the developer window in the 3D scene and on the map (key K), with the name over each (TODO 192 step 3).
  /world/things/markers:
    type: visualization_msgs/msg/MarkerArray
    pub: [things]
    sub: []
    note: Only with things:=true, 10 Hz, frame odom - for RViz and the screens. A DELETEALL first, then per thing a box coloured by its kind (aav_things looks.py, the screens' colours - person yellow, car, truck, bus, motorcycle blue, stop sign red, other names green, unknown orange; grey while coasting), an arrow for its speed, and its name, id and speed as text, such as 'person 3 1.2 m/s' (an unknown thing its id only; R where the radar gave the speed).
  /drivers/nav/behaviour/state:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [behaviour]
    sub: []
    note: Only with behaviour:=true, 5 Hz - for the screens. name behaviour; message STATE and why; level OK, or WARN with a warning or in ASK. values state (DRIVE, APPROACH, STOPPED, WAIT, GO, ASK), reason (sign, obstacle, fence, goal, a lock's name, the e-stop), cap_mps (what /drivers/nav/speed_limit carries), left_m (to the binding stop's final stop, inf for none), warnings (sign passed, no lock; sign lost; odometry stale).

  # --- our own costmaps (aav_costmap, a trial beside Nav2's: docs/own-costmap.md) ---
  /drivers/nav/costmap/local:
    type: nav_msgs/msg/OccupancyGrid
    pub: [costmap]
    sub: []
    note: Only with navigation.launch.py costmap:=own (sim.launch.py passes it). Our local costmap, Nav2's local_costmap rebuilt in Rust from the same nav2.yaml block - odom, a 20 m x 20 m window of 0.1 m cells rolling with the car, the static map, the same obstacle layers and sources (the lidar scan; the radar, cameras, ghost and cubes where they run), inflation with the car's padded outline. Updated at the block's update_frequency (5 Hz), sent at its publish_frequency (2 Hz). Values as Nav2's publisher writes them - 0 free, 1-98 inflated, 99 inscribed, 100 lethal, -1 unknown. Nav2's /local_costmap/costmap keeps running beside it.
  /drivers/nav/costmap/local_raw:
    type: nav2_msgs/msg/Costmap
    pub: [costmap]
    sub: [mppi_lag]
    note: The same grid as /drivers/nav/costmap/local, with Nav2's raw costs (0 free, 1-252 inflated, 253 inscribed, 254 lethal, 255 unknown), as Nav2's /local_costmap/costmap_raw sends them. aav_mppi_lag's mppi_lag reads it instead of Nav2's when both tracker:=mppi_lag and costmap:=own (its costmap_topic).
  /drivers/nav/costmap/global:
    type: nav_msgs/msg/OccupancyGrid
    pub: [costmap]
    sub: []
    note: Only with costmap:=own. Our global costmap - map frame, the map's own size and cells, the static map (unknown kept), the radar and lidar layers when the planner sees them (plan_around), inflation (3 m, scaling 1.0). With lane_costs (navigation.launch.py lane_costs:=<lanes.yaml>, sim.launch.py lane_costs:=true; a challenger, TODO 148) the lanes layer goes over the inflation - each road of the lane map a soft ramp, 0 at the right lane's centre (by /plan's way along the road; both lanes until a plan says), the lane's lines 50, the oncoming lanes 100, the kerb 150, 150 for 1 m past it, never as high as inscribed. 1 Hz. Nav2's planner_server keeps its own; our planner (planner:=own) plans on this one when costmap:=own (docs/own-planner.md).
  /drivers/nav/costmap/global_raw:
    type: nav2_msgs/msg/Costmap
    pub: [costmap]
    sub: [planner]
    note: The same grid as /drivers/nav/costmap/global, raw costs (0-255). aav_planner's planner plans on it with planner:=own and costmap:=own (with costmap:=nav2 it reads Nav2's /global_costmap/costmap_raw and its _raw_updates instead).
  /drivers/nav/costmap/status:
    type: diagnostic_msgs/msg/DiagnosticStatus
    pub: [costmap]
    sub: []
    note: Only with costmap:=own. One message per costmap each time it is sent. name 'costmap local' or 'costmap global'; level OK (0), or WARN (1) while it waits for something; values costmap (local, global), update_ms (the last update's time, wall clock), worst_ms, updates, lethal_cells, cells (width x height), waiting_for (odometry, map -> odom, the map, a silent sensor topic, a sensor frame with no mount in /tf_static; empty when nothing is missing), lane_routes (the routes that changed the lanes layer's costs; 0 without lane_costs).

  # --- street routes (aav_routes, docs/routes.md): for real streets later, the lot first ---
  /drivers/nav/route/destination:
    type: geographic_msgs/msg/GeoPointStamped
    pub: []
    sub: [street_router]
    note: Where to go, as lat/lon (ros2 topic pub, or a screen). street_router asks the router (Valhalla on this computer, pixi run -e routes router) for the way there along the streets, from the car's newest /localization/gps/fix.
  /drivers/nav/route/goal:
    type: geometry_msgs/msg/PoseStamped
    pub: []
    sub: [street_router]
    note: Where to go, as a map-frame point (RViz, or a screen); street_router turns it into lat/lon with /toLL, then as /drivers/nav/route/destination.
  /drivers/nav/route/place:
    type: std_msgs/msg/String
    pub: []
    sub: [street_router]
    note: Where to go, by name ("Mackenzie Building", "P4", "minto"), with router campus only. The site file (aav_routes config/campus_site.yaml) and OpenStreetMap's named buildings and lots; the route runs on the campus's own road graph (campus_graph.py) to the nearest road the car may use. A name that fits several, or none, says why on /drivers/nav/route/status.
  /drivers/nav/route/waypoints:
    type: geographic_msgs/msg/GeoPath
    pub: [street_router]
    sub: []
    note: Transient local (latched). The route as GPS waypoints spaced for Nav2 (10-30 m apart, each facing along the street, the car's own start left out) - what /drivers/nav/route/follow sends to /follow_gps_waypoints.
  /drivers/nav/route/path:
    type: nav_msgs/msg/Path
    pub: [street_router]
    sub: [map]
    note: Transient local (latched). The whole route in the map frame (each point through /fromLL). The map window (map, aav_hud) draws it violet under Nav2's blue plan; RViz and Foxglove can too. Not a plan Nav2 follows.
  /drivers/nav/route/status:
    type: std_msgs/msg/String
    pub: [street_router]
    sub: []
    note: Transient local (latched). For people - the route's length and the router's time for a normal car, or why there's no route (no router, no GPS fix, longer than max_length).

  # --- frames and plumbing ---
  /tf:
    type: tf2_msgs/msg/TFMessage
    pub: [ekf_local, ekf_global, robot_state_publisher]
    sub: [debug_hud]
    live: [turtle, sim, car, replay, bench]
    note: map -> odom (ekf_global), odom -> base_link (ekf_local), moving joints (robot_state_publisher).
  /tf_static:
    type: tf2_msgs/msg/TFMessage
    pub: [robot_state_publisher, map_to_odom_no_gps]
    sub: [debug_hud]
    live: [turtle, sim, car, replay, bench]
    note: base_link -> chassis and every sensor frame, from vehicle.yaml through the URDF. With gps:=false, map_to_odom_no_gps adds a fixed map -> odom.
  /robot_description:
    type: std_msgs/msg/String
    pub: [robot_state_publisher]
    sub: []
    live: [turtle, sim, car, replay, bench]
  /clock:
    type: rosgraph_msgs/msg/Clock
    pub: [gz_bridge, carla_adapter, simulator]
    sub: []
    live: [sim, replay]
    note: Simulation time; every node runs with use_sim_time:=true in sim and replay. Gazebo publishes it every physics step (1 kHz, unthrottled); our own simulator (aav_simulator, simulator:=own) does the same.
  /diagnostics:
    type: diagnostic_msgs/msg/DiagnosticArray
    pub: [twist_mux, ekf_local, ekf_global, sensor_watchdog, camera_stream_front_left, camera_stream_front_right, localization_health]
    sub: [language_drive]
    note: ROS's diagnostics. sensor_watchdog reports each input it watches once a second (OK, WARN, ERROR when it stops the car); for the wheels, also the gaps to the IMU (speed_gap, turn_gap, worst_speed_gap, worst_turn_gap), to tune the cross check on the car. twist_mux reports each lock once a second ("lock locks.estop" locked or free) - the only place a node started after an e-stop can learn it, since /safety/estop is sent a few times and its senders go away. language_drive refuses to move while it says locked, or while it is silent. camera_stream_<camera> reports its stream once a second (status name camera_stream - front_left; ERROR with no pictures, WARN under half the frame rate) - decoder (the one auto picked - gst-mac on a Mac), fps_in, fps_out, dropped, decoder_starts, work_ms, detect_ms, delay_s, and with time_code the measured delays (arrival_* and detection_*_ms - median, p95, max). localization_health reports each of its checks once a second (status name localization_health - gyro_bias, ...; OK, WARN or STALE, never stopping anything), with their numbers (bias_dps, sigma_m, tilt_deg...). pixi run check ignores the topic.

services:
  /drivers/nav/costmap/clear_entirely_local:
    type: nav2_msgs/srv/ClearEntireCostmap
    server: costmap
    note: Only with costmap:=own (aav_costmap). Forgets every mark in our local costmap, as Nav2's /local_costmap/clear_entirely_local_costmap does for its own; the map comes back at the next update, the sensors' marks as they see them again. With tracker:=mppi_lag too (mppi_lag reads ours), navigation.launch.py remaps bt_navigator's local clear here, so the behaviour trees' recovery clears the costmap the follower reads.
  /drivers/nav/costmap/clear_entirely_global:
    type: nav2_msgs/srv/ClearEntireCostmap
    server: costmap
    note: The same for our global costmap. Our navigator (navigator:=own, aav_navigator) calls it with costmap:=own - its planner recovery and its clear-both recovery; bt_navigator's trees still clear Nav2's.
  /spine/arm:
    type: std_srvs/srv/SetBool
    server: spine_bridge
    note: The spine ignores drive commands until armed. Refused while /safety/estop is true, and while the safety gate is shut - /safety/output_mux/state not OPEN for the bridge's target (car, bench or gazebo by its source), or not heard for gate_timeout (1.5 s) - with the reason, starting "the safety gate is shut" (Ben, 24 Oct). Disarming always works. The bench and Gazebo's spine profile arm through arm_when_open (aav_spine), which asks each second until the gate opens. On the car with the CAN spine (actuators:=can), the bench and Gazebo's spine profile; not with role:=sensors.
  /fromLL:
    type: robot_localization/srv/FromLL
    server: navsat_transform
    note: Lat/lon -> map x, y. Nav2's follow_gps_waypoints calls it, and point_driver (aav_drive_to_point) for a lat/lon goal, and street_router, for /drivers/nav/route/path.
  /toLL:
    type: robot_localization/srv/ToLL
    server: navsat_transform
    note: Map x, y -> lat/lon. street_router calls it for /drivers/nav/route/goal.
  /datum:
    type: robot_localization/srv/SetDatum
    server: navsat_transform
    note: Move the map origin (normally set once from navsat.yaml).
  /ekf_local/set_pose:
    type: robot_localization/srv/SetPose
    server: ekf_local
  /ekf_global/set_pose:
    type: robot_localization/srv/SetPose
    server: ekf_global
    note: Re-seed the start pose by hand (heading!).
  /safety/output_mux/clear:
    type: std_srvs/srv/Trigger
    server: output_mux
    note: A person reopens the output mux after it latched STOP. Refused, with the reason, while the evidence remains (a simulated source still announced, the sensor mux still reporting a problem); once accepted, commands flow again after 2 s of all clear.
  /safety/sensor_watchdog/clear:
    type: std_srvs/srv/Trigger
    server: sensor_watchdog
    note: A person says all is right again after a fault the watchdog latches - a GPS jump, wheels that disagreed with the IMU and GPS, a HUD that dropped out (LOST). pixi run clear watchdog (pixi run sim-fault clear in Gazebo).
  /safety/geofence/clear:
    type: std_srvs/srv/Trigger
    server: geofence
    note: A person drove the car back inside the fence after OUTSIDE, or understood a JUMP (both latch) - pixi run clear geofence. Refused, with the reason, while the car is still outside or the global pose can't be trusted. NEAR and LOST let go by themselves. Only people call it - never aav_language's drive server or the MCP tools (aav_language test_drive_tools.py checks).
  /drivers/nav/route/follow:
    type: std_srvs/srv/Trigger
    server: street_router
    note: A person sends street_router's newest route to Nav2, as a /follow_gps_waypoints goal. Nothing goes to Nav2 without it (unless follow_at_once is set). Nav2, twist_mux, ego and the spine stay in charge.
  /vehicle/sim/spawn_entity:
    type: simulation_interfaces/srv/SpawnEntity
    server: simulator
    note: Our own simulator (aav_simulator, simulator:=own) - put a model in the world while it runs, as Gazebo's create service does - uri an SDF model file or model://name, initial_pose in the map frame (x, y and yaw). The ROS standard simulation interface (simulation_interfaces). Its lidar and radar see the model from the next step, and the car stops at it. tools/sim_check.py places its box and post with it. Sim only.
  /vehicle/sim/delete_entity:
    type: simulation_interfaces/srv/DeleteEntity
    server: simulator
    note: Take a model placed with /vehicle/sim/spawn_entity (or the launch's obstacle:=true) away again. Sim only.
  /vehicle/sim/set_entity_state:
    type: simulation_interfaces/srv/SetEntityState
    server: simulator
    note: Our own simulator - put the car (entity aav) at state.pose in the map frame (x, y and yaw), standing still, as Gazebo's set_pose service does; a non-zero twist is refused. The truth and wheel odometry jump with it. tools/sim_frames.py --simulator own uses it. Sim only.
  /track/set_parameters:
    type: rcl_interfaces/srv/SetParameters
    server: track
    note: aav_track's own parameter service (every ROS node has one). Listed for the one change that matters - tracker, swapped live (a trial, docs/trials.md) - refused unless the node runs with live_swap:=true, which only sim.launch.py sets. Called by the debug HUD's keys 1-4 (debug_hud, aav_hud), only while /system/source says SIM, by Lichtblick's cockpit layout (its Call Service panel, through foxglove_bridge on 127.0.0.1), and by `ros2 param set /track tracker lqr`.

actions:
  /scripted_drive:
    type: aav_interfaces/action/ScriptedDrive
    server: scripted_driver
    note: Drive a speed profile (accelerate, hold for a time or distance, stop). Phase 1. Sent by language_drive (aav_language) for drive() and turn() - a whole distance, ramps included.
  /drive_to_point:
    type: aav_interfaces/action/DriveToPoint
    server: point_driver
    note: Drive to one point B (lat/lon through /fromLL, or map x/y) and stop there - speed up gently, hold, slow down by the distance left at half vehicle.yaml's max_brake. Pure pursuit, turning towards B first. Refuses B over 200 m away or inside the tightest turn; on REAL only with confirmed (pixi run drive-to-point asks). Sent by point_cli (pixi run drive-to-point) and tools/sim_check.py --drive-to-point.
  /follow_path:
    type: nav2_msgs/action/FollowPath
    server: controller_server
    note: bt_navigator's FollowPath - follow one planned path (replaced every second as the planner replans). Served by controller_server (MPPI or RPP) with tracker:=none, the default; with tracker:=pure_pursuit|stanley|lqr|mpc|mpc_full|mpc_lag by aav_track's track node instead (tracker:=mppi_lag - aav_mppi_lag's mppi_lag), and controller_server's own is renamed /follow_path_unused (a launch remapping - rcl_action resolves action names with the node's remappings). The same goal checks either way - nav2.yaml's xy_goal_tolerance and yaw_goal_tolerance, and its progress checker.
  /compute_path_to_pose:
    type: nav2_msgs/action/ComputePathToPose
    server: planner_server
    note: Nav2's own - one path from the car to a pose, planner_id GridBased (whichever planner:= runs). With planner:=diffusion diffusion_planner serves it instead, and planner_server's own is renamed /compute_path_to_pose_lattice, which diffusion_planner calls for each plan (the fallback). bt_navigator calls it every second while it drives; controller_compare (tools/controller_compare.py --planners) calls it once before each leg, to score the planner alone - its planning_time, the path's length and tightest turn. Planning only, nothing moves.
  /drivers/nav/planner/compute_path_to_pose:
    type: nav2_msgs/action/ComputePathToPose
    server: planner
    note: Only with planner:=own (aav_planner, a trial; docs/own-planner.md). Our planner - Nav2's State Lattice in Rust, the same primitives file, penalties and smoothing - one path from the car (map -> odom -> base_link on /tf, or the goal's start with use_start) to a map pose, on the global costmap costmap:= picks. navigation.launch.py remaps bt_navigator's compute_path_to_pose here, so the trees call ours; planner_server's /compute_path_to_pose keeps answering beside it (controller_compare asks both from the same spot). Error codes as Nav2's (203-208). Planning only, nothing moves.
  /drivers/nav/planner/compute_path_through_poses:
    type: nav2_msgs/action/ComputePathThroughPoses
    server: planner
    note: Only with planner:=own (aav_planner). One path through each goal in turn - a plan a leg, each leg from the last goal, joined - as planner_server does. bt_navigator's compute_path_through_poses is remapped here, and our navigator calls it for through-poses goals and waypoints. Error codes as Nav2's (303-309); the message names the leg that failed.
  /navigate_to_pose:
    type: nav2_msgs/action/NavigateToPose
    server: [bt_navigator, navigator]
    note: Drive to one map-frame pose. Nav2's bt_navigator (navigator:=nav2, the car's), or our navigator in its place (navigator:=own - aav_navigator, the sim's default; docs/own-navigator.md) under the same name, so no goal sender knows which runs. Ours - our behaviour trees' logic in Rust - plans (the planner's ComputePathToPose), follows (FollowPath), replans every second except on the final approach, recovers (clear the local or global costmap, then in turn clear both, wait 5 s, back up 1 m when reversing; 6 times), else gives up with the step's Nav2 error code. A newer goal on any of its actions replaces this one (aborted, code 0). Feedback as Nav2's (distance along the path, recoveries).
  /navigate_through_poses:
    type: nav2_msgs/action/NavigateThroughPoses
    server: [bt_navigator, navigator]
    note: One path through each pose. Ours (navigator:=own) - the planner's ComputePathThroughPoses, replanned every 3 s from the car through the poses not yet passed - passed within 1 m, or passed along the path.
  /follow_waypoints:
    type: nav2_msgs/action/FollowWaypoints
    server: [waypoint_follower, navigator]
    note: Map poses. Nav2's waypoint_follower stops at each; ours (navigator:=own) drives them as one through-poses goal (waypoints - pass_through, the default - no stop and no turn to face at each, TODO 140) or as Nav2's does (stop_at_each). missed_waypoints - those not reached when it ends.
  /follow_gps_waypoints:
    type: nav2_msgs/action/FollowGPSWaypoints
    server: [waypoint_follower, navigator]
    note: Lat/lon waypoints. street_router sends its street route here (asked on /drivers/nav/route/follow). Phase 2. language_drive (aav_language) sends one point for go_to_gps(), at most 200 m away. Nav2's waypoint_follower puts them on the map through /fromLL; ours (navigator:=own) by navsat_transform's datum (aav_localization navsat.yaml - the same UTM steps as /fromLL, map-core's earth.rs), then as follow_waypoints.

frames:
  map: {parent: null, by: "ekf_global (map -> odom)", note: "x east, y north; origin = the navsat datum"}
  odom: {parent: map, by: "ekf_local (odom -> base_link)", note: "continuous; starts where the car starts"}
  base_link: {parent: odom, note: "on the ground under the rear axle centre; x forward, y left, z up"}
  chassis: {parent: base_link, by: robot_state_publisher}
  imu_link: {parent: base_link, by: robot_state_publisher, note: "vehicle.yaml sensors.imu_link"}
  gps_link: {parent: base_link, by: robot_state_publisher, note: "the antenna"}
  radar_link: {parent: base_link, by: robot_state_publisher}
  camera_left_link: {parent: base_link, by: robot_state_publisher}
  camera_right_link: {parent: base_link, by: robot_state_publisher}
  camera_rear_link: {parent: base_link, by: robot_state_publisher, note: "turned 180 degrees: it looks back"}
  lidar_link: {parent: base_link, by: robot_state_publisher, note: "the roof lidar"}
