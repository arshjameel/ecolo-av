    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="526.717241" y="280.883878" transform="rotate(-0 526.717241 280.883878)">no Spin: a car can't turn on the spot</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="459.372414" y="330.300767" transform="rotate(-0 459.372414 330.300767)">⇉</text>
   </g>
   <g id="text_3">
