# The test ladder (docs/wrap-up.md, Ben's plan of 23 Nov; docs/proving-it.md): ten rungs,
# named for what the car can do, bottom first. tools/ladder.py reads this; it is the only
# list of rungs there is.
#
# A rung:
#   number     1 to 9, or S (the sensors, beside every rung)
#   id         its short name on the command line (pixi run ladder run stands, or run 1)
#   title      its name on the screen
#   question   THE question it answers, one sentence
#   graphs     the graphs that answer it
#   passes     the pass mark, fixed before the run
#   chapter    the final report's chapter it feeds
#   built      false: listed and shown as "not built yet"; never run, never recorded
#   today      what exists today, for a rung not built
#   needs      the rungs that must have passed in the same place before it opens
#   sim, car   the command that runs it in the simulator, and on the car ('' = none yet)
#   tests, sim_one   its tests one at a time, by the runner's own list
#              (tools/ladder_report.py), and the command for one ({test}); never recorded
#   after      what a person does after its run, as on the car
#   how        the page about it
#   The word --attach in a sim command: it uses the Ravensim already open on this
#   computer (pixi run dry-run), so the car in the picture is the one tested; with none
#   open it starts its own, with no picture (car-test decides).
#
# A car rung also needs its own simulator run to have passed. Progress is saved outside git
# (~/aav-tests/ladder.yaml), a line a result, under the rung's id.
#
# Old names (before 23 Nov): stands is still stands (rung 1: the same run, the same pass
# mark). code, stack and bench are the checks below. hallway, lot and route are not rungs
# any more: their old lines stay in the progress file and are not shown (rungs 2 to 4 will
# be judged by their own graphs, not by those sessions' pass marks).
rungs:
  - number: '1'
    id: stands
    title: 'On stands: accelerate, brake, turn'
    question: Do the actuators follow a command, the right way?
    graphs:
      - the wheels' speed, asked for against measured
      - the steering angle, asked for against measured
      - the brake, asked for against measured
      - 'faults on purpose: did each stop the car, and in how long'
    passes: >-
      Every step of the stands run passes: the wheels reach each speed step up within
      25 % (or 0.05 m/s), the steering tests give their numbers, and every fault tried
      is caught and the car still inside its limit (2 to 3 s).
    chapter: The car and its model
    built: true
    needs: []
    sim: pixi run car-test --stands --sim --attach --no-manual
    sim_one: pixi run car-test --stands --sim --attach --no-manual --only {test}
    tests: stands
    after: >-
      The last step presses the e-stop, and it stays pressed, as on the car. Before the
      next run a person lets it go: pixi run clear estop --sim. The simulated car is
      lifted onto stands for the run and lowered after it.
    car: pixi run car-test --stands
    how: docs/actuator-tests.md
  - number: '2'
    id: speed
    title: 'On the ground: speed up, slow down'
    question: How fast does it speed up and stop?
    graphs: [speed against time, stopping distance against speed]
    passes: "the model's speed within 10 %, its stop within 0.2 m (proposed)"
    chapter: The car and its model
    built: false
    today: 'the tests exist (speed-up, brake; car-test --hallway); no rung reads them yet'
    needs: [stands]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: '3'
    id: straight
    title: 'A straight line: speed up, hold, slow down'
    question: Does it hold a speed, and drive straight?
    graphs: [the speed held, drift to the side]
    passes: wanders under 0.1 m/s; drifts under 0.2 m in 10 m (proposed)
    chapter: The car and its model
    built: false
    today: 'built in part (the straight test); a hold-a-speed test is TODO 266'
    needs: [speed]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: '4'
    id: navigate
    title: Navigate, an empty costmap
    question: Does the whole stack drive from A to B with nothing in the way?
    graphs: ['the path driven over the plan', metres off the plan]
    passes: reaches the goal; under 0.3 m off the plan (proposed)
    chapter: Localization and mapping; Planning; Following
    built: false
    today: the stack does it in the simulator; no rung
    needs: [straight]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: '5'
    id: painted
    title: Navigate, a hand-painted obstacle
    question: Does it go round what we drew?
    graphs: ['the path driven over the plan, with the obstacle']
    passes: never touches; reaches the goal (proposed)
    chapter: Planning; Following; Safety
    built: false
    today: a ghost object only; painting a costmap by hand is to build
    needs: [navigate]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: '6'
    id: lidar
    title: "Navigate, the lidar's costmap"
    question: Does it go round what it sees?
    graphs: ['the path driven over the plan, with what the lidar marked']
    passes: never touches; reaches the goal (proposed)
    chapter: Planning; Following; Safety
    built: false
    today: runs in the simulator; no rung
    needs: [painted]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: '7'
    id: things
    title: Things around the car, moving ones too
    question: Does it find them and follow them?
    graphs: ["each thing's track against the truth"]
    passes: found within 1 s; position within 0.5 m (proposed)
    chapter: Perception
    built: false
    today: things are tracked; nothing predicts
    needs: [lidar]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: '8'
    id: names
    title: What is it? (the cameras)
    question: Does it name what it sees?
    graphs: ['right and wrong names, by kind']
    passes: to be proposed with the perception lead
    chapter: Perception
    built: false
    today: a detector exists; no rung
    needs: [things]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: '9'
    id: rules
    title: Rules of the road (behaviour)
    question: >-
      Does it do the right thing: stop at a stop sign, slow for the road ahead, stop at
      the goal, stay inside the fence?
    graphs: ['speed against distance to each stop, with the speed cap']
    passes: stops within 0.5 m of each mark; never over the cap (proposed)
    chapter: Behaviour
    built: false
    today: the behaviour planner runs in the simulator; no rung
    needs: [names]
    sim: ''
    car: ''
    how: docs/wrap-up.md
  - number: S
    id: sensors
    title: 'Sensors: IMU, GPS, cameras, lidar, radar'
    question: Is each one alive, on time, and believable?
    graphs: [rate and noise for each sensor]
    passes: each at its documented rate; still when the car is still (proposed)
    chapter: Sensors; Localization and mapping
    built: false
    today: checked inside rung 1 (its first two steps); no rung of its own
    needs: []
    sim: ''
    car: ''
    how: docs/wrap-up.md

# Before you start: the checks that move no car. Not rungs: they never open or shut one.
# Each is still run and recorded by the ladder (pixi run ladder run code), under the id it
# had as a rung before 23 Nov, so its old results are still its results.
checks:
  - id: code
    title: "the code's own tests"
    command: pixi run bash tools/test.sh
  - id: stack
    title: the whole stack drives in the simulator
    command: pixi run sim-check
  - id: bench
    title: 'the bench stand-in: the real boards, no car'
    command: pixi run bench-check
